<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- vinyl disc -->
  <circle cx="50" cy="50" r="46" fill="#1a1a1a"/>

  <!-- concentric grooves -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#3a3a3a" stroke-width="1" opacity="0.55"/>
  <circle cx="50" cy="50" r="33" fill="none" stroke="#3a3a3a" stroke-width="1" opacity="0.45"/>
  <circle cx="50" cy="50" r="26" fill="none" stroke="#3a3a3a" stroke-width="1" opacity="0.35"/>

  <!-- subtle highlight arc -->
  <path d="M 16 32 A 38 38 0 0 1 42 11" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.06"/>

  <!-- center label -->
  <circle cx="50" cy="50" r="16" fill="#2563EB"/>

  <!-- center hole -->
  <circle cx="50" cy="50" r="3" fill="#0d0d0d"/>
</svg>
