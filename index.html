<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clip Playlist</title>

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152x152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167x167.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#2563EB">
<meta name="apple-mobile-web-app-title" content="Clip Playlist">

<style>
  :root {
    --bg: #F5F5F7;
    --row: #FFFFFF;
    --surface: #FFFFFF;
    --track: rgba(120, 120, 128, 0.1);
    --hover: rgba(255, 159, 10, 0.06);
    --active: rgba(255, 159, 10, 0.12);
    --text: #1C1C1E;
    --text-secondary: #8E8E93;
    --accent: #FF9F0A;
    --danger: #FF3B30;
    --tab-bg: #FFFFFF;
    --hairline: rgba(0, 0, 0, 0.1);
    --shadow: 0 10px 28px rgba(0, 0, 0, 0.06);
    --panel-radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --row: #1C1C1E;
      --surface: #1C1C1E;
      --track: rgba(120, 120, 128, 0.18);
      --hover: rgba(255, 159, 10, 0.1);
      --active: rgba(255, 159, 10, 0.16);
      --text: #FFFFFF;
      --text-secondary: #8E8E93;
      --accent: #FF9F0A;
      --danger: #FF3B30;
      --tab-bg: #1C1C1E;
      --hairline: rgba(255, 255, 255, 0.14);
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font-family: inherit; }
  button { -webkit-appearance: none; color: inherit; }
  img { display: block; }

  .app-shell {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    position: relative;
  }

  /* ---------- sidebar (desktop) ---------- */
  .sidebar {
    display: none;
    flex-direction: column;
    width: 280px;
    flex-shrink: 0;
    background: var(--row);
    border-right: 0.5px solid var(--hairline);
    padding: 22px 12px;
    min-height: 100vh;
    position: sticky;
    top: 0;
  }
  .sidebar-title {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    padding: 4px 10px 22px;
  }
  .sidebar-nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 14px;
    font-weight: 400;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    transition: background 120ms, transform 100ms ease-out;
  }
  .sidebar-nav-item:hover { background: var(--hover); }
  .sidebar-nav-item.active { background: var(--active); color: var(--accent); font-weight: 500; }
  .sidebar-nav-item:active { transform: scale(0.99); }
  .sidebar-nav-item svg { flex-shrink: 0; }
  .sidebar-section-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-secondary);
    margin: 18px 10px 6px;
  }
  .sidebar-playlist-list { display: flex; flex-direction: column; gap: 1px; }

  .list-add-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: none;
    background: transparent;
    color: var(--accent);
    font-size: 14px;
    font-weight: 500;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 6px;
    text-align: left;
    transition: background 120ms, transform 100ms ease-out;
  }
  .list-add-btn:hover { background: var(--hover); }
  .list-add-btn:active { transform: scale(0.99); }

  /* ---------- playlist rows (shared by sidebar + mobile picker sheet + add-to-playlist picker) ---------- */
  .playlist-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 120ms, transform 100ms ease-out;
  }
  .playlist-row:hover { background: var(--hover); }
  .playlist-row.active { background: var(--active); }
  .playlist-row.active .playlist-name { color: var(--accent); font-weight: 500; }
  .playlist-row:active { transform: scale(0.99); }
  .playlist-row .playlist-name {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    font-weight: 400;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .playlist-row .row-check { color: var(--accent); flex-shrink: 0; display: flex; }
  .playlist-row .row-more-btn {
    border: none;
    background: transparent;
    color: var(--text-secondary);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .playlist-row .row-more-btn:hover { color: var(--text); background: var(--hover); }
  .playlist-row input.inline-rename-input {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    padding: 4px 7px;
  }
  .playlist-row input.inline-rename-input.invalid { border-color: var(--danger); }

  /* ---------- screens ---------- */
  .screen {
    display: none;
    padding: 0 16px 150px;
    animation: fade-in 180ms ease-out;
  }
  .screen.active { display: block; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  .nav-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0 14px;
    gap: 12px;
  }
  .nav-header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .title-switcher {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    padding: 0;
    color: inherit;
    cursor: pointer;
    min-width: 0;
  }
  .title-switcher h1 {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.015em;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 260px;
  }
  .title-switcher .chev-down { color: var(--text-secondary); flex-shrink: 0; margin-top: 5px; }
  .title-switcher:active { opacity: 0.7; }
  .nav-header h1 {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.015em;
    margin: 0;
  }
  .nav-action {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: var(--row);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    box-shadow: var(--shadow);
    transition: transform 100ms ease-out;
  }
  .nav-action:active { transform: scale(0.94); }

  .section-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-secondary);
    margin: 20px 0 8px;
  }

  /* ---------- list rows ---------- */
  .list-meta { font-size: 13px; color: var(--text-secondary); margin: -8px 0 4px; }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 2px;
    cursor: pointer;
    border-radius: 8px;
    transition: transform 100ms ease-out, background 120ms;
  }
  .row:hover { background: var(--hover); }
  .row:active { transform: scale(0.99); }
  .row.drag-over { box-shadow: inset 0 2px 0 var(--accent); }
  .row.dragging { opacity: 0.4; }
  .row .grip {
    color: var(--text-secondary);
    cursor: grab;
    flex-shrink: 0;
    touch-action: none;
    opacity: 0.6;
  }
  .row .thumb {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--track);
    flex-shrink: 0;
  }
  .row .info { flex: 1; min-width: 0; }
  .row .title {
    font-size: 15px;
    font-weight: 400;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row.active .title { color: var(--accent); }
  .row .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row .subtitle .time-edit { border-bottom: 1px dotted currentColor; cursor: text; }
  .row .subtitle .time-edit:hover { color: var(--accent); }
  .row .subtitle input.time-input {
    width: 44px;
    background: var(--track);
    border: 1px solid var(--accent);
    border-radius: 4px;
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    padding: 1px 4px;
  }
  .row .subtitle input.time-input.invalid { border-color: var(--danger); color: var(--danger); }
  .row .trailing-btn {
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .row .trailing-btn:active { transform: scale(0.88); }
  .row .row-num, .row .title-stack, .row .col-date, .row .col-time { display: none; }
  .col-header { display: none; }
  .row .add-check {
    color: var(--accent);
    opacity: 0;
    transition: opacity 150ms;
    flex-shrink: 0;
    display: flex;
  }
  .row.added .add-check { opacity: 1; }

  .empty-state {
    padding: 56px 16px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 15px;
  }

  /* ---------- search field ---------- */
  .search-field {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 9px 10px;
    margin: 2px 0 8px;
  }
  .search-field svg { color: var(--text-secondary); flex-shrink: 0; }
  .search-field input {
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 14px;
    flex: 1;
    min-width: 0;
  }
  .search-field input:focus { outline: none; }
  .search-field input::placeholder { color: var(--text-secondary); }

  /* ---------- library page: play all ---------- */
  .play-all-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    border: none;
    background: var(--row);
    border-radius: 10px;
    padding: 11px 14px;
    margin: 4px 0 14px;
    cursor: pointer;
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    box-shadow: var(--shadow);
    transition: transform 100ms ease-out;
  }
  .play-all-row:active { transform: scale(0.99); }
  .play-all-icon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .play-all-label { flex: 1; }
  .play-all-count { font-size: 13px; color: var(--text-secondary); font-weight: 400; }

  /* ---------- now playing ---------- */
  .np-art {
    width: 100%;
    aspect-ratio: 16 / 9;
    margin: 8px 0 18px;
    border-radius: 16px;
    overflow: hidden;
    background: #000;
    box-shadow: var(--shadow);
  }
  #playerDock {
    position: fixed;
    top: -9999px;
    left: -9999px;
    width: 320px;
    height: 180px;
    background: #000;
    overflow: hidden;
    border-radius: 16px;
    z-index: 25;
    pointer-events: none;
  }
  #playerDock.docked { pointer-events: auto; }
  #playerDock #player, #playerDock iframe { width: 100%; height: 100%; display: block; border: 0; }
  .np-meta { text-align: center; margin: 0 0 18px; }
  .np-title { font-size: 18px; font-weight: 600; color: var(--text); }
  .np-artist { font-size: 14px; color: var(--text-secondary); margin-top: 2px; }
  .np-progress-track {
    width: 100%;
    height: 4px;
    background: var(--track);
    border-radius: 2px;
    margin: 4px 0 6px;
    cursor: pointer;
    position: relative;
  }
  .np-progress-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; }
  .np-time-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 26px;
  }
  .np-transport {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin-bottom: 26px;
  }
  .np-transport button {
    border: none;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    display: flex;
    transition: transform 100ms ease-out;
  }
  .np-transport button:active { transform: scale(0.9); }
  .transport-toggle {
    position: relative;
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 100ms ease-out, color 150ms;
  }
  .transport-toggle:active { transform: scale(0.9); }
  .transport-toggle.on { color: var(--accent); }
  .transport-toggle .repeat-badge {
    position: absolute;
    bottom: 1px;
    right: 1px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 8px;
    font-weight: 700;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .transport-toggle .repeat-badge[hidden] { display: none; }
  .np-toggles { display: flex; justify-content: center; gap: 10px; margin-bottom: 8px; }
  .pill-toggle {
    border: 1px solid var(--track);
    background: transparent;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 100ms ease-out;
  }
  .pill-toggle.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pill-toggle:active { transform: scale(0.96); }
  .np-status { text-align: center; font-size: 12px; color: var(--text-secondary); margin-top: 18px; }

  /* ---------- mini player ---------- */
  .mini-player {
    position: fixed;
    left: 50%;
    bottom: 78px;
    transform: translateX(-50%);
    width: calc(100% - 24px);
    max-width: 456px;
    background: var(--row);
    border-radius: 14px;
    box-shadow: var(--shadow);
    border: 0.5px solid var(--hairline);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    cursor: pointer;
    z-index: 20;
    overflow: hidden;
  }
  .mini-player[hidden] { display: none; }
  .mini-progress { position: absolute; top: 0; left: 0; height: 2px; background: var(--accent); width: 0%; }
  .mini-player .thumb { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--track); }
  .mini-player .info { flex: 1; min-width: 0; }
  .mini-player .title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mini-player button {
    position: relative;
    border: none;
    background: transparent;
    color: var(--text);
    flex-shrink: 0;
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 100ms ease-out;
  }
  .mini-player button:active { transform: scale(0.88); }
  .mini-player button.on { color: var(--accent); }
  .mini-left { display: contents; cursor: pointer; }
  .mini-artist { display: none; }
  .mini-center { display: contents; }
  .mini-transport { display: contents; }
  #miniShuffleBtn, #miniPrevBtn, #miniRepeatBtn, .mini-scrub, .mini-right { display: none; }

  /* ---------- tab bar ---------- */
  .tab-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    background: var(--tab-bg);
    border-top: 0.5px solid var(--hairline);
    padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px));
    z-index: 15;
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 10px;
    font-weight: 500;
    padding: 4px 0;
    cursor: pointer;
    transition: transform 100ms ease-out;
  }
  .tab-item.active { color: var(--accent); }
  .tab-item:active { transform: scale(0.95); }

  /* ---------- sheets ---------- */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    z-index: 30;
    opacity: 0;
    transition: opacity 260ms ease;
    pointer-events: none;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translate(-50%, 100%);
    width: 100%;
    max-width: 480px;
    max-height: 82vh;
    background: var(--row);
    border-radius: 16px 16px 0 0;
    z-index: 31;
    transition: transform 300ms cubic-bezier(0.32, 0.72, 0, 1);
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .sheet.open { transform: translate(-50%, 0); }
  .sheet-grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--track); margin: 8px auto 4px; flex-shrink: 0; }
  .sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 16px 12px;
    flex-shrink: 0;
  }
  .sheet-header h2 { font-size: 17px; font-weight: 600; margin: 0; }
  .sheet-header .text-btn {
    border: none;
    background: transparent;
    color: var(--accent);
    font-size: 15px;
    cursor: pointer;
    padding: 4px;
  }
  .sheet-body { overflow-y: auto; padding: 0 16px 20px; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
  .field input {
    background: var(--track);
    border: none;
    border-radius: 10px;
    padding: 12px 12px;
    font-size: 15px;
    color: var(--text);
  }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .primary-btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    padding: 14px;
    cursor: pointer;
    margin-top: 4px;
    transition: transform 100ms ease-out;
  }
  .primary-btn:active { transform: scale(0.98); }
  .primary-btn:disabled { opacity: 0.5; }
  .status-line { font-size: 13px; color: var(--text-secondary); text-align: center; margin-top: 10px; min-height: 16px; }
  .status-line.error { color: var(--danger); }
  .status-line.ok { color: var(--accent); }

  /* ---------- action sheet (row actions) ---------- */
  .action-list { padding: 4px 16px 8px; }
  .action-btn {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 0.5px solid var(--hairline);
    padding: 15px 4px;
    font-size: 15px;
    font-weight: 400;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .action-btn:last-child { border-bottom: none; }
  .action-btn.danger { color: var(--danger); }
  .action-btn:disabled { opacity: 0.3; }
  .action-btn:active:not(:disabled) { background: var(--hover); }

  /* ---------- desktop layout (>= 900px) ---------- */
  @media (min-width: 900px) {
    .app-shell {
      max-width: none;
      margin: 0;
      display: flex;
      align-items: stretch;
      gap: 16px;
      height: 100vh;
      box-sizing: border-box;
      padding: 16px;
      padding-bottom: 112px;
      background: var(--bg);
      overflow: hidden;
    }
    .sidebar {
      display: flex;
      border-right: none;
      border-radius: var(--panel-radius);
      box-shadow: var(--shadow);
      height: auto;
      min-height: 0;
      top: 0;
      overflow-y: auto;
    }
    .tab-bar { display: none; }
    .app {
      flex: 1;
      min-width: 0;
      background: var(--row);
      border-radius: var(--panel-radius);
      box-shadow: var(--shadow);
      overflow-y: auto;
    }
    .screen { padding: 0 40px 130px; }
    .title-switcher { cursor: default; }
    .title-switcher .chev-down { display: none; }

    /* playlist/library header banner */
    #screen-playlists .nav-header,
    #screen-library .nav-header {
      margin: 0 -40px 20px;
      padding: 36px 40px 16px;
      background: transparent;
    }

    /* column headers above the clip list */
    .col-header {
      display: grid;
      align-items: center;
      column-gap: 14px;
      padding: 0 6px 8px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--hairline);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      position: sticky;
      top: 0;
      background: var(--row);
      z-index: 5;
    }
    .col-header .col-time-label { text-align: right; }
    #screen-playlists .col-header { grid-template-columns: 22px 26px 52px 1fr 130px 110px 36px; }
    #screen-library .col-header { grid-template-columns: 26px 52px 1fr 130px 110px 36px; }

    /* table-style rows */
    .row {
      display: grid;
      align-items: center;
      column-gap: 14px;
      padding: 10px 6px;
    }
    #screen-playlists .row { grid-template-columns: 22px 26px 52px 1fr 130px 110px 36px; }
    #screen-library .row { grid-template-columns: 26px 52px 1fr 130px 110px 36px; }
    .row .thumb { width: 44px; height: 44px; border-radius: 6px; }
    .row .grip { justify-self: center; }
    .row .row-num {
      display: block;
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .row.active .row-num { color: var(--accent); }
    .row .title { display: none; }
    .row .title-stack { display: block; min-width: 0; }
    .row .title-main {
      font-size: 14px;
      font-weight: 400;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row.active .title-main { color: var(--accent); }
    .row .title-artist {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row .subtitle { display: none; }
    .row .col-date {
      display: block;
      font-size: 12.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row .col-time {
      display: block;
      font-size: 12.5px;
      color: var(--text-secondary);
      text-align: right;
      white-space: nowrap;
    }
    .row .col-time .time-edit { border-bottom: 1px dotted currentColor; cursor: text; }
    .row .col-time .time-edit:hover { color: var(--accent); }
    .row .col-time input.time-input { width: 44px; }

    /* bottom player bar: three Spotify-style sections, floating as its own card */
    .mini-player {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      left: 16px;
      right: 16px;
      bottom: 16px;
      transform: none;
      width: auto;
      max-width: none;
      border-radius: var(--panel-radius);
      padding: 12px 24px;
      column-gap: 16px;
    }
    .mini-progress { display: none; }
    .mini-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      max-width: 360px;
      justify-self: start;
    }
    .mini-player .thumb { width: 44px; height: 44px; border-radius: 6px; }
    .mini-player .title { font-size: 13px; }
    .mini-player .info { max-width: none; }
    .mini-artist {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mini-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      justify-self: center;
      padding-top: 2px;
    }
    .mini-transport { display: flex; align-items: center; gap: 16px; }
    #miniShuffleBtn, #miniPrevBtn, #miniRepeatBtn { display: flex; }
    #miniPlayBtn { width: 30px; height: 30px; }
    #miniPlayIcon { width: 28px; height: 28px; }
    .mini-scrub {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 420px;
      max-width: 36vw;
    }
    .mini-scrub span { font-size: 11px; color: var(--text-secondary); flex-shrink: 0; }
    .mini-progress-track {
      flex: 1;
      height: 3px;
      background: var(--track);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    .mini-progress-track-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; }
    .mini-right { display: block; justify-self: end; }

    /* Now Playing takes over the full remaining area, not a small centered card */
    #screen-nowplaying.screen.active {
      max-width: none;
      margin: 0;
      padding: 56px 48px 40px;
      height: 100%;
      min-height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }
    #screen-nowplaying .nav-header { display: none; }
    #screen-nowplaying .np-art { max-width: 640px; margin: 0 0 32px; }
    #screen-nowplaying .np-meta { margin-bottom: 28px; }
    #screen-nowplaying .np-title { font-size: 24px; font-weight: 600; }
    #screen-nowplaying .np-artist { font-size: 15px; margin-top: 4px; }
    #screen-nowplaying .np-progress-track,
    #screen-nowplaying .np-time-row,
    #screen-nowplaying .np-transport,
    #screen-nowplaying .np-toggles {
      width: 100%;
      max-width: 640px;
    }
    #screen-nowplaying .np-transport { gap: 32px; margin-bottom: 32px; }
    #screen-nowplaying #playBtn svg { width: 54px; height: 54px; }
    #screen-nowplaying #prevBtn svg, #screen-nowplaying #nextBtn svg { width: 32px; height: 32px; }

    /* Sheets become centered modal dialogs instead of bottom sheets */
    .sheet-grabber { display: none; }
    .sheet {
      left: 50%;
      top: 50%;
      bottom: auto;
      transform: translate(-50%, -46%);
      width: 90%;
      max-width: 440px;
      max-height: 80vh;
      border-radius: 16px;
      opacity: 0;
      pointer-events: none;
      transition: transform 260ms cubic-bezier(0.32, 0.72, 0, 1), opacity 200ms ease;
    }
    .sheet.open {
      transform: translate(-50%, -50%);
      opacity: 1;
      pointer-events: auto;
    }
    .sheet-header { padding: 16px 20px 12px; }
    .sheet-body { padding: 0 20px 20px; }
  }
</style>

  let repeatMode = "off";      // "off" | "playlist" | "one"
  let shuffleOn = false;
  let shuffleOrder = [];       // array of clip ids — playback order override when shuffleOn
  let pollTimer = null;
  let dragSourceIndex = null;
  let activeTab = "playlists";

  // ---------- helpers ----------

  function fmt(s) {
    s = Math.max(0, Math.floor(s));
    const m = Math.floor(s / 60);
    const sec = String(s % 60).padStart(2, "0");
    return m + ":" + sec;
  }

  function escapeHtml(str) {
    return String(str ?? "").replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[ch]));
  }

  function thumbUrl(videoId) {
    return "https://i.ytimg.com/vi/" + encodeURIComponent(videoId) + "/default.jpg";
  }

  function parseTimeToSeconds(input) {
    input = String(input ?? "").trim();
    if (!input) return NaN;
    if (input.includes(":")) {
      const parts = input.split(":").map((p) => p.trim());
      if (parts.some((p) => p === "" || isNaN(Number(p)))) return NaN;
      let seconds = 0;
      for (const p of parts) seconds = seconds * 60 + Number(p);
      return seconds;
    }
    const n = Number(input);
    return isNaN(n) ? NaN : n;
  }

  function extractVideoId(raw) {
    const input = String(raw ?? "").trim();
    try {
      const u = new URL(input);
      const host = u.hostname.replace(/^www\./, "");
      if (host === "youtu.be") {
        return u.pathname.slice(1).split("/")[0] || null;
      }
      if (host === "youtube.com" || host === "m.youtube.com" || host === "music.youtube.com") {
        if (u.pathname === "/watch") return u.searchParams.get("v");
        let m = u.pathname.match(/\/shorts\/([^/?]+)/);
        if (m) return m[1];
        m = u.pathname.match(/\/embed\/([^/?]+)/);
        if (m) return m[1];
        m = u.pathname.match(/\/live\/([^/?]+)/);
        if (m) return m[1];
      }
    } catch (e) {
      // not a parseable URL — allow a bare video id
      if (/^[a-zA-Z0-9_-]{10,12}$/.test(input)) return input;
    }
    return null;
  }

  function splitTitle(title) {
    const dashPattern = /\s+[-–—]\s+/;
    const m = title.match(dashPattern);
    if (m) {
      const idx = title.search(dashPattern);
      const artist = title.slice(0, idx).trim();
      const name = title.slice(idx + m[0].length).trim();
      if (artist && name) return { name, artist };
    }
    return { name: title.trim(), artist: "" };
  }

  async function fetchOEmbedTitle(videoId) {
    const watchUrl = "https://www.youtube.com/watch?v=" + encodeURIComponent(videoId);
    const res = await fetch("https://www.youtube.com/oembed?url=" + encodeURIComponent(watchUrl) + "&format=json");
    if (!res.ok) throw new Error("oEmbed lookup failed (" + res.status + ")");
    const data = await res.json();
    return data.title || "";
  }

  let ytApiReadyPromise = null;
  function waitForYTApiReady() {
    if (apiReady) return Promise.resolve();
    if (!ytApiReadyPromise) {
      ytApiReadyPromise = new Promise((resolve) => {
        (function check() {
          if (apiReady) resolve();
          else setTimeout(check, 50);
        })();
      });
    }
    return ytApiReadyPromise;
  }

  // Briefly loads a video in a hidden, throwaway YT.Player instance just to read its
  // full duration (no Data API key needed), then tears the instance down.
  function fetchVideoDuration(videoId, timeoutMs) {
    timeoutMs = timeoutMs || 12000;
    return waitForYTApiReady().then(() => new Promise((resolve, reject) => {
      const host = document.getElementById("tempPlayerHost");
      const el = document.createElement("div");
      host.appendChild(el);
      let settled = false;
      let probePlayer = null;

      // YT.Player replaces its target element with the actual <iframe> in place, so
      // `el` itself may already be detached by the time we clean up — clear the whole
      // (dedicated, single-purpose) host container rather than trying to remove `el`.
      const cleanup = () => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        try { if (probePlayer && probePlayer.destroy) probePlayer.destroy(); } catch (err) {}
        host.replaceChildren();
      };

      const timer = setTimeout(() => {
        cleanup();
        reject(new Error("timed out fetching video duration"));
      }, timeoutMs);

      try {
        probePlayer = new YT.Player(el, {
          videoId,
          playerVars: { autoplay: 0, controls: 0 },
          events: {
            onReady: () => {
              const duration = probePlayer.getDuration();
              cleanup();
              if (duration && duration > 0) resolve(duration);
              else reject(new Error("could not determine video duration"));
            },
            onError: () => {
              cleanup();
              reject(new Error("failed to load video"));
            }
          }
        });
      } catch (err) {
        cleanup();
        reject(err);
      }
    }));
  }

  function rowToClip(row) {
    return {
      id: row.id,
      name: row.name,
      artist: row.artist || "",
      videoId: row.video_id,
      start: Number(row.start_seconds),
      end: Number(row.end_seconds),
      position: row.position,
      createdAt: row.created_at
    };
  }

  function rowToLibraryClip(row) {
    return {
      id: row.id,
      name: row.name,
      artist: row.artist || "",
      videoId: row.video_id,
      start: Number(row.start_seconds),
      end: Number(row.end_seconds),
      lastUsedAt: row.last_used_at,
      createdAt: row.created_at
    };
  }

  function formatDateAdded(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  function getCurrentIndex() {
    return queue.findIndex((c) => c.id === currentId);
  }

  // ---------- generic sheet helpers ----------

  function openSheet(sheetEl, backdropEl) {
    backdropEl.classList.add("open");
    sheetEl.classList.add("open");

  function closeSheet(sheetEl, backdropEl) {
    sheetEl.classList.remove("open");
    backdropEl.classList.remove("open");

  function wireSheetDismiss(sheetEl, backdropEl, onClose) {
    backdropEl.addEventListener("click", () => { closeSheet(sheetEl, backdropEl); if (onClose) onClose(); });
  }

  // ---------- tabs / nav ----------

  function syncNavActiveStates() {
    document.getElementById("tabPlaylists").classList.toggle("active", activeTab === "playlists");
    document.getElementById("tabLibrary").classList.toggle("active", activeTab === "library");
    document.getElementById("tabNowPlaying").classList.toggle("active", activeTab === "nowplaying");

    activeTab = tab;
    document.getElementById("screen-playlists").classList.toggle("active", tab === "playlists");
    document.getElementById("screen-library").classList.toggle("active", tab === "library");
    document.getElementById("screen-nowplaying").classList.toggle("active", tab === "nowplaying");
    syncNavActiveStates();
    updateMiniPlayerVisibility();

  // ---------- persistent player dock ----------
  // Keeps the actual YT.Player iframe mounted for the whole session — never destroyed
  // or recreated on navigation. Only its visual position changes.

  function positionPlayerDock() {
    const dock = document.getElementById("playerDock");
    const slot = document.getElementById("npArtSlot");
    if (activeTab === "nowplaying" && slot) {
      const rect = slot.getBoundingClientRect();
      if (rect.width > 0 && rect.height > 0) {
        dock.style.top = rect.top + "px";
        dock.style.left = rect.left + "px";
        dock.style.width = rect.width + "px";
        dock.style.height = rect.height + "px";
        dock.classList.add("docked");
        return;
      }
    }
    dock.classList.remove("docked");
    dock.style.top = "-9999px";
    dock.style.left = "-9999px";
    dock.style.width = "320px";
    dock.style.height = "180px";
  }

  window.addEventListener("resize", positionPlayerDock);
  window.addEventListener("scroll", positionPlayerDock, true);

  document.getElementById("tabPlaylists").addEventListener("click", () => switchTab("playlists"));
  document.getElementById("tabLibrary").addEventListener("click", () => switchTab("library"));

  document.getElementById("sidebarNowPlayingBtn").addEventListener("click", () => switchTab("nowplaying"));

  async function loadPlaylists() {
    const { data, error } = await supabase.from("playlists").select("*").order("created_at", { ascending: true });
    if (error) throw error;
    playlists = data || [];
  }

  function buildPlaylistRow(p, onSelect) {
    const row = document.createElement("div");

  // ---------- playlist actions (rename / delete) ----------

  function openPlaylistActions(playlist, nameSpanEl) {
    document.getElementById("actionSheetTitle").textContent = playlist.name;
    const list = document.getElementById("actionList");
    list.innerHTML = "";

    const renameBtn = document.createElement("button");
    renameBtn.className = "action-btn";
    renameBtn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> Rename';
    renameBtn.addEventListener("click", () => {
      closeSheet(document.getElementById("actionSheet"), document.getElementById("actionBackdrop"));
      startPlaylistRename(nameSpanEl, playlist);
    });

    const deleteBtn = document.createElement("button");

    deleteBtn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0-1 14a1 1 0 01-1 1H7a1 1 0 01-1-1L5 6"/></svg> Delete Playlist';
    deleteBtn.addEventListener("click", () => {
      closeSheet(document.getElementById("actionSheet"), document.getElementById("actionBackdrop"));
      deletePlaylist(playlist);
    });

    list.appendChild(renameBtn);
    list.appendChild(deleteBtn);

  document.getElementById("actionCancelBtn").addEventListener("click", () =>
    closeSheet(document.getElementById("actionSheet"), document.getElementById("actionBackdrop"))
  );
  wireSheetDismiss(document.getElementById("actionSheet"), document.getElementById("actionBackdrop"));

  function startPlaylistRename(spanEl, playlist) {
    if (spanEl.querySelector("input")) return;
    const original = playlist.name;
    const input = document.createElement("input");
    input.type = "text";
    input.className = "inline-rename-input";
    input.value = original;
    spanEl.textContent = "";
    spanEl.appendChild(input);
    input.focus();
    input.select();

    let settled = false;

    const trySave = async () => {
      const val = input.value.trim();
      if (!val) {
        input.classList.add("invalid");
        return false;
      }
      settled = true;
      if (val !== original) {
        const { error } = await supabase.from("playlists").update({ name: val }).eq("id", playlist.id);
        if (error) {
          window.alert("Failed to rename playlist: " + error.message);
        } else {
          playlist.name = val;
        }
      }
      refreshPlaylistUI();
      return true;
    };

    input.addEventListener("input", () => input.classList.remove("invalid"));
    input.addEventListener("click", (e) => e.stopPropagation());
    input.addEventListener("keydown", async (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        await trySave();
      } else if (e.key === "Escape") {
        e.preventDefault();
        settled = true;
        refreshPlaylistUI();
      }
    });
    input.addEventListener("blur", async () => {
      if (settled) return;
      const ok = await trySave();
      if (!ok) { settled = true; refreshPlaylistUI(); }
    });
  }

  async function getClipCountForPlaylist(id) {
    const { count, error } = await supabase
      .from("clips")
      .select("id", { count: "exact", head: true })
      .eq("playlist_id", id);
    if (error) {
      console.error("Failed to count clips", error);
      return null;
    }
    return count || 0;
  }

  async function getNextPositionForPlaylist(playlistId) {
    if (playlistId === currentPlaylistId) {
      return clips.length ? Math.max(...clips.map((c) => c.position)) + 1 : 0;
    }
    const { data, error } = await supabase
      .from("clips")
      .select("position")
      .eq("playlist_id", playlistId)
      .order("position", { ascending: false })
      .limit(1);
    if (error || !data || data.length === 0) return 0;
    return data[0].position + 1;
  }

  async function deletePlaylist(playlist) {
    if (playlists.length <= 1) {
      window.alert("You need at least one playlist — create another before deleting this one.");
      return;
    }

    const count = await getClipCountForPlaylist(playlist.id);
    const countText = count === null ? "its clips" : count + (count === 1 ? " clip" : " clips");
    const ok = window.confirm('Delete "' + playlist.name + '"? This removes all ' + countText + " in it.");
    if (!ok) return;

    const { error } = await supabase.from("playlists").delete().eq("id", playlist.id);
    if (error) {
      window.alert("Failed to delete playlist: " + error.message);
      return;
    }

    playlists = playlists.filter((p) => p.id !== playlist.id);

    if (playlist.id === currentPlaylistId) {
      await switchPlaylist(playlists[0].id);
    } else {
      refreshPlaylistUI();
    }
  }

  async function loadClipsForCurrentPlaylist() {
    if (!currentPlaylistId) { clips = []; return; }
    const { data, error } = await supabase
      .from("clips")
      .select("*")
      .eq("playlist_id", currentPlaylistId)
      .order("position", { ascending: true });
    if (error) {
      console.error("Failed to load clips", error);
      clips = [];
      document.getElementById("statusLabel").textContent = "failed to load clips: " + error.message;
      return;
    }
    clips = (data || []).map(rowToClip);
  }

  async function switchPlaylist(playlistId) {
    if (!playlistId || playlistId === currentPlaylistId) return;
    currentPlaylistId = playlistId;
    localStorage.setItem(LS_KEY, playlistId);

    await loadClipsForCurrentPlaylist();

    // loadClipsForCurrentPlaylist() always replaces `clips` with a fresh array. If that's
    // the same playlist actively playing, keep `queue` pointed at the live rows (by id,
    // not stale objects) without touching currentId or the player.
    if (queueSource === "playlist" && queuePlaylistId === currentPlaylistId) {
      queue = clips;
    }

    // Switching which playlist is being *browsed* must never touch active playback —
    // only prime the player from this playlist if nothing has ever been loaded yet.
    const playbackActive = currentId !== null;
    if (!playbackActive) {
      queue = clips;
      queueSource = "playlist";
      queuePlaylistId = currentPlaylistId;
      if (clips.length > 0) currentId = clips[0].id;
      if (shuffleOn) regenerateShuffleOrder();

      if (player) {
        if (clips.length > 0) {
          const c = clips[0];
          player.loadVideoById({ videoId: c.videoId, startSeconds: c.start });
          player.pauseVideo();
          document.getElementById("statusLabel").textContent = "";
        } else {
          stopAndClearPlayer();
        }
      } else {
        maybeInitPlayer();
        if (clips.length === 0) document.getElementById("statusLabel").textContent = "queue is empty — add a clip below";
      }
    }

    refreshPlaylistUI();
    switchTab("playlists");
    renderQueue();
    updateMiniPlayer();
  }

  // ---------- new playlist sheet ----------

  function openNewPlaylistSheet() {
    document.getElementById("newPlaylistInput").value = "";
    openSheet(document.getElementById("newPlaylistSheet"), document.getElementById("newPlaylistBackdrop"));
    setTimeout(() => document.getElementById("newPlaylistInput").focus(), 260);

  function closeNewPlaylistSheet() {

  document.getElementById("newPlaylistCancelBtn").addEventListener("click", closeNewPlaylistSheet);
  wireSheetDismiss(document.getElementById("newPlaylistSheet"), document.getElementById("newPlaylistBackdrop"));

  document.getElementById("newPlaylistForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("newPlaylistInput");
    const name = input.value.trim();
    if (!name) return;
    const submitBtn = e.target.querySelector("button[type=submit]");

    submitBtn.disabled = false;

  // ---------- rendering: queue (playlists screen) ----------

  function playFromPlaylist(id, autoplay) {
    if (queueSource !== "playlist" || queue !== clips) {
      queue = clips;
      queueSource = "playlist";
      queuePlaylistId = currentPlaylistId;
      if (shuffleOn) regenerateShuffleOrder();
    }
    loadClipById(id, autoplay);
  }

  function renderQueue() {
    const q = document.getElementById("queueList");
    q.innerHTML = "";
    document.getElementById("countLabel").textContent = clips.length
      ? clips.length + (clips.length === 1 ? " clip" : " clips")

    clips.forEach((c, i) => {

        '<span class="grip" title="Drag to reorder">' +

        "</span>" +
        '<span class="row-num">' + (i + 1) + "</span>" +
        '<img class="thumb" src="' + thumbUrl(c.videoId) + '" alt="" loading="lazy">' +
        '<div class="info">' +
          '<div class="title">' + escapeHtml(displayName) + "</div>" +
          '<div class="title-stack">' +
            '<div class="title-main">' + escapeHtml(c.name) + "</div>" +
            (c.artist ? '<div class="title-artist">' + escapeHtml(c.artist) + "</div>" : "") +
          "</div>" +
          '<div class="subtitle">' +
            '<span class="time-edit" data-field="start">' + fmt(c.start) + "</span>" +
            " – " +
            '<span class="time-edit" data-field="end">' + fmt(c.end) + "</span>" +
          "</div>" +
        "</div>" +
        '<div class="col-date">' + formatDateAdded(c.createdAt) + "</div>" +
        '<div class="col-time">' +
          '<span class="time-edit" data-field="start">' + fmt(c.start) + "</span>" +
          " – " +
          '<span class="time-edit" data-field="end">' + fmt(c.end) + "</span>" +
        "</div>" +
        '<button class="trailing-btn" title="More">' +
          '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>' +
        "</button>";

      // click row -> load clip
      row.addEventListener("click", () => playFromPlaylist(c.id, true));

      // inline start/end editing
      row.querySelectorAll(".time-edit").forEach((span) => {
        span.addEventListener("click", (e) => {
          e.stopPropagation();
          startTimeEdit(span, c);
        });
      });

      // row actions sheet
      row.querySelector(".trailing-btn").addEventListener("click", (e) => {
        e.stopPropagation();
        openRowActions(c, i);
      });

      // drag and drop (initiated from handle, dropped on row)
      const handle = row.querySelector(".grip");
      handle.draggable = true;
      handle.addEventListener("dragstart", (e) => {
        e.stopPropagation();
        dragSourceIndex = i;
        e.dataTransfer.effectAllowed = "move";
        try { e.dataTransfer.setData("text/plain", String(c.id)); } catch (err) {}
        row.classList.add("dragging");
      });
      handle.addEventListener("dragend", (e) => {
        e.stopPropagation();
        row.classList.remove("dragging");
        dragSourceIndex = null;
      });
      row.addEventListener("dragover", (e) => {
        if (dragSourceIndex === null) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        row.classList.add("drag-over");
      });
      row.addEventListener("dragleave", () => row.classList.remove("drag-over"));
      row.addEventListener("drop", (e) => {
        e.preventDefault();
        row.classList.remove("drag-over");
        if (dragSourceIndex === null || dragSourceIndex === i) return;
        reorderByIndex(dragSourceIndex, i);
        dragSourceIndex = null;
      });

      q.appendChild(row);
    });
  }

  function reorderByIndex(fromIdx, toIdx) {
    const [item] = clips.splice(fromIdx, 1);
    clips.splice(toIdx, 0, item);
    renderQueue();
    persistOrder();
  }

  function moveClip(idx, dir) {
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= clips.length) return;
    const [item] = clips.splice(idx, 1);
    clips.splice(newIdx, 0, item);
    renderQueue();
    persistOrder();
  }

  async function persistOrder() {
    clips.forEach((c, i) => { c.position = i; });
    try {
      await Promise.all(
        clips.map((c) => supabase.from("clips").update({ position: c.position }).eq("id", c.id))
      );
    } catch (err) {
      console.error("Failed to persist clip order", err);
    }
  }

  function startTimeEdit(span, clip) {
    if (span.querySelector("input")) return; // already editing
    const field = span.dataset.field; // "start" | "end"
    const original = fmt(clip[field]);
    const input = document.createElement("input");
    input.type = "text";
    input.className = "time-input";
    input.value = original;
    span.textContent = "";
    span.appendChild(input);
    input.focus();
    input.select();

    let settled = false;

    const trySave = async () => {
      const val = parseTimeToSeconds(input.value);
      const other = field === "start" ? clip.end : clip.start;
      const validNumber = !isNaN(val) && val >= 0;
      const validOrder = field === "start" ? val < other : val > other;
      if (!validNumber || !validOrder) {
        input.classList.add("invalid");
        return false;
      }
      const prev = clip[field];
      clip[field] = val;
      const dbField = field === "start" ? "start_seconds" : "end_seconds";
      const { error } = await supabase.from("clips").update({ [dbField]: val }).eq("id", clip.id);
      if (error) {
        console.error("Failed to save time edit", error);
        clip[field] = prev;
      }
      settled = true;
      renderQueue();
      return true;
    };

    input.addEventListener("input", () => input.classList.remove("invalid"));
    input.addEventListener("click", (e) => e.stopPropagation());
    input.addEventListener("keydown", async (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        await trySave();
      } else if (e.key === "Escape") {
        e.preventDefault();
        settled = true;
        renderQueue();
      }
    });
    input.addEventListener("blur", async () => {
      if (settled) return;
      const ok = await trySave();
      if (!ok) { settled = true; renderQueue(); } // silently revert if left invalid
    });
  }

  async function deleteClip(id) {
    const idx = clips.findIndex((c) => c.id === id);
    if (idx === -1) return;
    const clip = clips[idx];
    const ok = window.confirm('Delete "' + clip.name + '" from the queue?');
    if (!ok) return;

    const { error } = await supabase.from("clips").delete().eq("id", id);
    if (error) {
      window.alert("Failed to delete: " + error.message);
      return;
    }

    clips.splice(idx, 1);
    await persistOrder();
    if (shuffleOn) shuffleOrder = shuffleOrder.filter((sid) => sid !== id);

    if (clips.length === 0) {
      if (queueSource === "playlist") currentId = null;
      stopAndClearPlayer();
    } else if (id === currentId) {
      const newIdx = Math.min(idx, clips.length - 1);
      loadClipById(clips[newIdx].id, false);
    }
    renderQueue();
    updateMiniPlayer();
  }

  async function addLibraryEntryToPlaylist(entry, playlistId) {
    const nextPosition = await getNextPositionForPlaylist(playlistId);
    const { data, error } = await supabase
      .from("clips")
      .insert({
        playlist_id: playlistId,
        position: nextPosition,
        name: entry.name,
        artist: entry.artist || null,
        video_id: entry.videoId,
        start_seconds: entry.start,
        end_seconds: entry.end
      })
      .select()
      .single();

    if (error) {
      window.alert("Failed to add clip: " + error.message);
      return null;
    }

    if (playlistId === currentPlaylistId) {
      clips.push(rowToClip(data));
      if (shuffleOn && queueSource === "playlist" && queue === clips) {
        const insertAt = Math.floor(Math.random() * (shuffleOrder.length + 1));
        shuffleOrder.splice(insertAt, 0, data.id);
      }
      renderQueue();
      if (!currentId) {
        queue = clips;
        queueSource = "playlist";
        queuePlaylistId = currentPlaylistId;
        currentId = data.id;
      }
      maybeInitPlayer();
      updateMiniPlayer();
    }

    const now = new Date().toISOString();
    entry.lastUsedAt = now;
    supabase.from("clip_library").update({ last_used_at: now }).eq("id", entry.id).then(({ error: bumpError }) => {
      if (bumpError) console.error("Failed to bump last_used_at", bumpError);

        video_id: videoId,
        start_seconds: start,
        end_seconds: end,

        artist: artist || null,
        last_used_at: nowIso
      },
      { onConflict: "video_id,start_seconds,end_seconds" }

  // ---------- player ----------

  function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function regenerateShuffleOrder() {
    shuffleOrder = shuffleArray(queue.map((c) => c.id));
  }

  function getQueuePosition() {
    if (shuffleOn && shuffleOrder.length === queue.length && queue.length > 0) {
      let pos = shuffleOrder.indexOf(currentId);
      if (pos === -1) pos = 0;
      return { order: shuffleOrder, pos };
    }
    const order = queue.map((c) => c.id);
    let pos = getCurrentIndex();
    if (pos === -1) pos = 0;
    return { order, pos };
  }

  function loadClipById(id, autoplay) {
    const c = queue.find((cl) => cl.id === id);
    if (!c) return;
    currentId = c.id;
    renderQueue();
    renderLibraryPage(currentLibrarySearch);
    updateMiniPlayer();
    if (!player) {
      maybeInitPlayer(autoplay);
      return;
    }
    if (player.loadVideoById) {
      player.loadVideoById({ videoId: c.videoId, startSeconds: c.start });
      if (!autoplay) player.pauseVideo();
    }
  }

  function playNext() {
    if (queue.length === 0) return;
    const { order, pos } = getQueuePosition();
    let newPos = pos + 1;
    let autoplay = true;

    if (newPos >= order.length) {
      if (repeatMode === "playlist") {
        if (shuffleOn) shuffleOrder = shuffleArray(queue.map((c) => c.id));
        newPos = 0;
        autoplay = true;
      } else {
        // end of queue, repeat off: wrap to the first clip but don't autoplay
        newPos = 0;
        autoplay = false;
      }
    }

    const targetOrder = shuffleOn && shuffleOrder.length === queue.length ? shuffleOrder : order;
    loadClipById(targetOrder[newPos], autoplay);
  }

  function playPrev() {
    if (queue.length === 0) return;
    const { order, pos } = getQueuePosition();
    let newPos = pos - 1;
    if (newPos < 0) newPos = order.length - 1;
    loadClipById(order[newPos], true);
  }

  function updateRepeatButtonUI() {
    const on = repeatMode !== "off";
    const badgeVisible = repeatMode === "one";
    const title = repeatMode === "off" ? "Repeat: off" : repeatMode === "playlist" ? "Repeat: all" : "Repeat: one";
    [document.getElementById("repeatBtn"), document.getElementById("miniRepeatBtn")].forEach((btn) => {
      btn.classList.toggle("on", on);
      btn.title = title;
    });
    [document.getElementById("repeatBadge"), document.getElementById("miniRepeatBadge")].forEach((badge) => {
      badge.hidden = !badgeVisible;
    });
  }

  function updateShuffleButtonUI() {
    const title = shuffleOn ? "Shuffle: on" : "Shuffle: off";
    [document.getElementById("shuffleBtn"), document.getElementById("miniShuffleBtn")].forEach((btn) => {
      btn.classList.toggle("on", shuffleOn);
      btn.title = title;
    });
  }

  function cycleRepeatMode() {
    const idx = REPEAT_MODES.indexOf(repeatMode);
    repeatMode = REPEAT_MODES[(idx + 1) % REPEAT_MODES.length];
    localStorage.setItem(REPEAT_LS_KEY, repeatMode);
    updateRepeatButtonUI();
  }

  function toggleShuffle() {
    shuffleOn = !shuffleOn;
    localStorage.setItem(SHUFFLE_LS_KEY, shuffleOn ? "1" : "0");
    if (shuffleOn) {
      regenerateShuffleOrder();
    } else {
      shuffleOrder = [];
    }
    updateShuffleButtonUI();
  }

  document.getElementById("repeatBtn").addEventListener("click", cycleRepeatMode);
  document.getElementById("shuffleBtn").addEventListener("click", toggleShuffle);
  document.getElementById("miniRepeatBtn").addEventListener("click", (e) => { e.stopPropagation(); cycleRepeatMode(); });
  document.getElementById("miniShuffleBtn").addEventListener("click", (e) => { e.stopPropagation(); toggleShuffle(); });
  document.getElementById("miniPrevBtn").addEventListener("click", (e) => { e.stopPropagation(); playPrev(); });

  function maybeInitPlayer(autoplay) {
    if (!apiReady || !dataReady || player || queue.length === 0) return;
    let idx = getCurrentIndex();
    if (idx === -1) { idx = 0; currentId = queue[0].id; }
    const c = queue[idx];
    player = new YT.Player("player", {
      videoId: c.videoId,
      playerVars: { start: Math.floor(c.start), rel: 0, modestbranding: 1, autoplay: autoplay ? 1 : 0 },
      events: {
        onReady: () => {
          document.getElementById("statusLabel").textContent = "";
          startPolling();
          updateMiniPlayer();
        },
        onStateChange: onStateChange
      }
    });
  }

  window.onYouTubeIframeAPIReady = function () {
    apiReady = true;
    maybeInitPlayer();
  };

  function setPlayIcon(playing) {
    const bigIcon = document.getElementById("playIcon");
    const miniIcon = document.getElementById("miniPlayIcon");
    const path = playing
      ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
    bigIcon.innerHTML = path;
    miniIcon.innerHTML = path;
  }

  function onStateChange(e) {
    if (e.data === YT.PlayerState.PLAYING) setPlayIcon(true);
    if (e.data === YT.PlayerState.PAUSED) setPlayIcon(false);
  }

  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(() => {
      if (!player || !player.getCurrentTime) return;
      const idx = getCurrentIndex();
      if (idx === -1) return;
      const c = queue[idx];
      const t = player.getCurrentTime();
      const dur = c.end - c.start;
      const elapsed = Math.max(0, t - c.start);
      const pct = dur > 0 ? Math.min(100, (elapsed / dur) * 100) : 0;
      document.getElementById("clipProgressFill").style.width = pct + "%";
      document.getElementById("miniProgressFill").style.width = pct + "%";
      document.getElementById("miniProgressTrackFill").style.width = pct + "%";
      document.getElementById("elapsedLabel").textContent = fmt(elapsed);
      document.getElementById("durationLabel").textContent = fmt(dur);
      document.getElementById("miniElapsedLabel").textContent = fmt(elapsed);
      document.getElementById("miniDurationLabel").textContent = fmt(dur);

      if (t >= c.end) {
        if (repeatMode === "one") {
          player.seekTo(c.start, true);
        } else if (autoAdvance) {
          playNext();
        } else {
          player.pauseVideo();
        }
      }
    }, 250);
  }

  function togglePlayPause() {
    if (!player || !player.getPlayerState) return;
    const state = player.getPlayerState();
    if (state === YT.PlayerState.PLAYING) player.pauseVideo();
    else player.playVideo();
  }

  document.getElementById("playBtn").addEventListener("click", togglePlayPause);
  document.getElementById("miniPlayBtn").addEventListener("click", (e) => { e.stopPropagation(); togglePlayPause(); });
  document.getElementById("nextBtn").addEventListener("click", () => playNext());
  document.getElementById("prevBtn").addEventListener("click", () => playPrev());
  document.getElementById("miniNextBtn").addEventListener("click", (e) => { e.stopPropagation(); playNext(); });
  document.getElementById("autoBtn").addEventListener("click", (e) => {
    autoAdvance = !autoAdvance;
    e.currentTarget.classList.toggle("on", autoAdvance);
  });
  document.getElementById("clipProgress").addEventListener("click", (e) => {
    if (!player || !player.seekTo) return;
    const idx = getCurrentIndex();
    if (idx === -1) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    const c = queue[idx];
    const target = c.start + pct * (c.end - c.start);
    player.seekTo(target, true);
  });

  document.getElementById("miniLeftArea").addEventListener("click", () => switchTab("nowplaying"));
  document.getElementById("miniProgressTrack").addEventListener("click", (e) => {
    e.stopPropagation();
    if (!player || !player.seekTo) return;
    const idx = getCurrentIndex();
    if (idx === -1) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    const c = queue[idx];
    const target = c.start + pct * (c.end - c.start);
    player.seekTo(target, true);
  });

  // ---------- mini player sync ----------

  function updateMiniPlayer() {
    const mini = document.getElementById("miniPlayer");
    const idx = getCurrentIndex();
    if (idx === -1) {
      mini.hidden = true;
      return;
    }
    const c = queue[idx];
    document.getElementById("miniThumb").src = thumbUrl(c.videoId);
    document.getElementById("miniTitle").textContent = c.artist ? c.artist + " — " + c.name : c.name;
    document.getElementById("miniArtist").textContent = c.artist || "";
    document.getElementById("nowLabel").textContent = c.name;
    document.getElementById("nowArtistLabel").textContent = c.artist || " ";
    mini.hidden = false;
    updateMiniPlayerVisibility();
  }

  const desktopLayoutQuery = window.matchMedia("(min-width: 900px)");

  function updateMiniPlayerVisibility() {
    const mini = document.getElementById("miniPlayer");
    if (getCurrentIndex() === -1) { mini.hidden = true; return; }
    // On desktop the mini player is a persistent bottom bar shown across every
    // screen (Spotify-style); on mobile Now Playing already has full transport
    // controls, so the mini bar would be redundant there.
    mini.hidden = activeTab === "nowplaying" && !desktopLayoutQuery.matches;
  }
  desktopLayoutQuery.addEventListener("change", updateMiniPlayerVisibility);

  // ---------- init ----------

  async function init() {
    repeatMode = REPEAT_MODES.includes(localStorage.getItem(REPEAT_LS_KEY)) ? localStorage.getItem(REPEAT_LS_KEY) : "off";
    shuffleOn = localStorage.getItem(SHUFFLE_LS_KEY) === "1";
    updateRepeatButtonUI();
    updateShuffleButtonUI();

    document.getElementById("statusLabel").textContent = "loading…";
    try {
      await loadPlaylists();
    } catch (err) {
      console.error("Failed to load playlists", err);
      document.getElementById("statusLabel").textContent = "failed to load playlists: " + err.message;
      dataReady = true;
      refreshPlaylistUI();
      renderQueue();
      return;
    }

    if (playlists.length === 0) {
      dataReady = true;
      refreshPlaylistUI();
      renderQueue();
      document.getElementById("statusLabel").textContent = "no playlists yet — create one above";
      return;
    }

    const saved = localStorage.getItem(LS_KEY);
    currentPlaylistId = playlists.some((p) => p.id === saved) ? saved : playlists[0].id;
    localStorage.setItem(LS_KEY, currentPlaylistId);
    refreshPlaylistUI();

    await loadClipsForCurrentPlaylist();
    queue = clips;
    queueSource = "playlist";
    queuePlaylistId = currentPlaylistId;
    if (clips.length > 0) currentId = clips[0].id;
    if (shuffleOn) regenerateShuffleOrder();
    dataReady = true;
    renderQueue();
    maybeInitPlayer();
    updateMiniPlayer();
    document.getElementById("statusLabel").textContent = clips.length
      ? "ready — press play"
      : "queue is empty — add a clip below";
  }

  init();

  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);
</script>

</body>
</html>
