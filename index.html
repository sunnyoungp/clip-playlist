<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clip Playlist</title>
<style>
  :root {
    --bg: #F2F2F7;
    --row: #FFFFFF;
    --track: rgba(118, 118, 128, 0.12);
    --text: #000000;
    --text-secondary: #8E8E93;
    --accent: #FF9F0A;
    --danger: #FF3B30;
    --tab-bg: #FFFFFF;
    --hairline: rgba(0, 0, 0, 0.15);
    --shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --row: #1C1C1E;
      --track: rgba(118, 118, 128, 0.24);
      --text: #FFFFFF;
      --text-secondary: #8E8E93;
      --accent: #FF9F0A;
      --danger: #FF3B30;
      --tab-bg: #1C1C1E;
      --hairline: rgba(255, 255, 255, 0.15);
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font-family: inherit; }
  button { -webkit-appearance: none; color: inherit; }
  img { display: block; }

  .app-shell {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    position: relative;
  }

  /* ---------- sidebar (desktop) ---------- */
  .sidebar {
    display: none;
    flex-direction: column;
    width: 280px;
    flex-shrink: 0;
    background: var(--row);
    border-right: 0.5px solid var(--hairline);
    padding: 22px 12px;
    min-height: 100vh;
    position: sticky;
    top: 0;
  }
  .sidebar-title {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.01em;
    padding: 4px 10px 22px;
  }
  .sidebar-nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 15px;
    font-weight: 500;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    transition: background 120ms, transform 100ms ease-out;
  }
  .sidebar-nav-item:hover { background: var(--track); }
  .sidebar-nav-item.active { background: var(--track); color: var(--accent); }
  .sidebar-nav-item:active { transform: scale(0.99); }
  .sidebar-nav-item svg { flex-shrink: 0; }
  .sidebar-section-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-secondary);
    margin: 18px 10px 6px;
  }
  .sidebar-playlist-list { display: flex; flex-direction: column; gap: 1px; }

  .list-add-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: none;
    background: transparent;
    color: var(--accent);
    font-size: 14px;
    font-weight: 500;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 6px;
    text-align: left;
    transition: background 120ms, transform 100ms ease-out;
  }
  .list-add-btn:hover { background: var(--track); }
  .list-add-btn:active { transform: scale(0.99); }

  /* ---------- playlist rows (shared by sidebar + mobile picker sheet) ---------- */
  .playlist-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 120ms, transform 100ms ease-out;
  }
  .playlist-row:hover { background: var(--track); }
  .playlist-row.active { background: var(--track); }
  .playlist-row.active .playlist-name { color: var(--accent); font-weight: 600; }
  .playlist-row:active { transform: scale(0.99); }
  .playlist-row .playlist-name {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .playlist-row .row-check { color: var(--accent); flex-shrink: 0; display: flex; }
  .playlist-row .row-more-btn {
    border: none;
    background: transparent;
    color: var(--text-secondary);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .playlist-row .row-more-btn:hover { color: var(--text); background: rgba(120, 120, 128, 0.16); }
  .playlist-row input.inline-rename-input {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    padding: 4px 7px;
  }
  .playlist-row input.inline-rename-input.invalid { border-color: var(--danger); }

  /* ---------- screens ---------- */
  .screen {
    display: none;
    padding: 0 16px 150px;
    animation: fade-in 180ms ease-out;
  }
  .screen.active { display: block; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  .nav-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0 14px;
    gap: 12px;
  }
  .title-switcher {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    padding: 0;
    color: inherit;
    cursor: pointer;
    min-width: 0;
  }
  .title-switcher h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 260px;
  }
  .title-switcher .chev-down { color: var(--text-secondary); flex-shrink: 0; margin-top: 5px; }
  .title-switcher:active { opacity: 0.7; }
  .nav-header h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .nav-action {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: var(--row);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    box-shadow: var(--shadow);
    transition: transform 100ms ease-out;
  }
  .nav-action:active { transform: scale(0.94); }

  .section-label {
    font-size: 15px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-secondary);
    margin: 20px 0 8px;
  }

  /* ---------- list rows ---------- */
  .list-meta { font-size: 13px; color: var(--text-secondary); margin: -8px 0 4px; }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 2px;
    cursor: pointer;
    border-radius: 8px;
    transition: transform 100ms ease-out, background 120ms;
  }
  .row:hover { background: var(--track); }
  .row:active { transform: scale(0.99); }
  .row.drag-over { box-shadow: inset 0 2px 0 var(--accent); }
  .row.dragging { opacity: 0.4; }
  .row .grip {
    color: var(--text-secondary);
    cursor: grab;
    flex-shrink: 0;
    touch-action: none;
    opacity: 0.6;
  }
  .row .thumb {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--track);
    flex-shrink: 0;
  }
  .row .info { flex: 1; min-width: 0; }
  .row .title {
    font-size: 17px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row.active .title { color: var(--accent); }
  .row .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row .subtitle .time-edit { border-bottom: 1px dotted currentColor; cursor: text; }
  .row .subtitle .time-edit:hover { color: var(--accent); }
  .row .subtitle input.time-input {
    width: 44px;
    background: var(--track);
    border: 1px solid var(--accent);
    border-radius: 4px;
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    padding: 1px 4px;
  }
  .row .subtitle input.time-input.invalid { border-color: var(--danger); color: var(--danger); }
  .row .trailing-btn {
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .row .trailing-btn:active { transform: scale(0.88); }
  .row .add-check {
    color: var(--accent);
    opacity: 0;
    transition: opacity 150ms;
    flex-shrink: 0;
    display: flex;
  }
  .row.added .add-check { opacity: 1; }

  .empty-state {
    padding: 56px 16px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 15px;
  }

  /* ---------- search field ---------- */
  .search-field {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--track);
    border-radius: 10px;
    padding: 9px 10px;
    margin: 2px 0 8px;
  }
  .search-field svg { color: var(--text-secondary); flex-shrink: 0; }
  .search-field input {
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 15px;
    flex: 1;
    min-width: 0;
  }
  .search-field input:focus { outline: none; }
  .search-field input::placeholder { color: var(--text-secondary); }

  /* ---------- now playing ---------- */
  .np-art {
    width: 100%;
    aspect-ratio: 16 / 9;
    margin: 8px 0 18px;
    border-radius: 16px;
    overflow: hidden;
    background: #000;
    box-shadow: var(--shadow);
  }
  .np-art #player { width: 100%; height: 100%; }
  .np-meta { text-align: center; margin: 0 0 18px; }
  .np-title { font-size: 20px; font-weight: 700; color: var(--text); }
  .np-artist { font-size: 15px; color: var(--text-secondary); margin-top: 2px; }
  .np-progress-track {
    width: 100%;
    height: 4px;
    background: var(--track);
    border-radius: 2px;
    margin: 4px 0 6px;
    cursor: pointer;
    position: relative;
  }
  .np-progress-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; }
  .np-time-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 26px;
  }
  .np-transport {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    margin-bottom: 26px;
  }
  .np-transport button {
    border: none;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    display: flex;
    transition: transform 100ms ease-out;
  }
  .np-transport button:active { transform: scale(0.9); }
  .np-toggles { display: flex; justify-content: center; gap: 10px; margin-bottom: 8px; }
  .pill-toggle {
    border: 1px solid var(--track);
    background: transparent;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 100ms ease-out;
  }
  .pill-toggle.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pill-toggle:active { transform: scale(0.96); }
  .np-status { text-align: center; font-size: 12px; color: var(--text-secondary); margin-top: 18px; }

  /* ---------- mini player ---------- */
  .mini-player {
    position: fixed;
    left: 50%;
    bottom: 78px;
    transform: translateX(-50%);
    width: calc(100% - 24px);
    max-width: 456px;
    background: var(--row);
    border-radius: 14px;
    box-shadow: var(--shadow);
    border: 0.5px solid var(--hairline);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    cursor: pointer;
    z-index: 20;
    overflow: hidden;
  }
  .mini-player[hidden] { display: none; }
  .mini-progress { position: absolute; top: 0; left: 0; height: 2px; background: var(--accent); width: 0%; }
  .mini-player .thumb { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--track); }
  .mini-player .info { flex: 1; min-width: 0; }
  .mini-player .title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mini-player button {
    border: none;
    background: transparent;
    color: var(--text);
    flex-shrink: 0;
    cursor: pointer;
    padding: 6px;
    display: flex;
    transition: transform 100ms ease-out;
  }
  .mini-player button:active { transform: scale(0.88); }

  /* ---------- tab bar ---------- */
  .tab-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    background: var(--tab-bg);
    border-top: 0.5px solid var(--hairline);
    padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px));
    z-index: 15;
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 10px;
    font-weight: 500;
    padding: 4px 0;
    cursor: pointer;
    transition: transform 100ms ease-out;
  }
  .tab-item.active { color: var(--accent); }
  .tab-item:active { transform: scale(0.95); }

  /* ---------- sheets ---------- */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    z-index: 30;
    opacity: 0;
    transition: opacity 260ms ease;
    pointer-events: none;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translate(-50%, 100%);
    width: 100%;
    max-width: 480px;
    max-height: 82vh;
    background: var(--row);
    border-radius: 16px 16px 0 0;
    z-index: 31;
    transition: transform 300ms cubic-bezier(0.32, 0.72, 0, 1);
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .sheet.open { transform: translate(-50%, 0); }
  .sheet-grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--track); margin: 8px auto 4px; flex-shrink: 0; }
  .sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 16px 12px;
    flex-shrink: 0;
  }
  .sheet-header h2 { font-size: 17px; font-weight: 600; margin: 0; }
  .sheet-header .text-btn {
    border: none;
    background: transparent;
    color: var(--accent);
    font-size: 15px;
    cursor: pointer;
    padding: 4px;
  }
  .sheet-body { overflow-y: auto; padding: 0 16px 20px; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
  .field input {
    background: var(--track);
    border: none;
    border-radius: 10px;
    padding: 12px 12px;
    font-size: 15px;
    color: var(--text);
  }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .primary-btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    padding: 14px;
    cursor: pointer;
    margin-top: 4px;
    transition: transform 100ms ease-out;
  }
  .primary-btn:active { transform: scale(0.98); }
  .primary-btn:disabled { opacity: 0.5; }
  .status-line { font-size: 13px; color: var(--text-secondary); text-align: center; margin-top: 10px; min-height: 16px; }
  .status-line.error { color: var(--danger); }
  .status-line.ok { color: var(--accent); }

  /* ---------- action sheet (row actions) ---------- */
  .action-list { padding: 4px 16px 8px; }
  .action-btn {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 0.5px solid var(--track);
    padding: 15px 4px;
    font-size: 17px;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .action-btn:last-child { border-bottom: none; }
  .action-btn.danger { color: var(--danger); }
  .action-btn:disabled { opacity: 0.3; }
  .action-btn:active:not(:disabled) { background: var(--track); }

  /* ---------- desktop layout (>= 900px) ---------- */
  @media (min-width: 900px) {
    .app-shell {
      max-width: 1280px;
      display: flex;
      align-items: flex-start;
    }
    .sidebar { display: flex; }
    .tab-bar { display: none; }
    .screen { padding: 0 40px 110px; max-width: 900px; }
    .title-switcher { cursor: default; }
    .title-switcher .chev-down { display: none; }
    .row { padding: 13px 6px; gap: 14px; }
    .row .thumb { width: 52px; height: 52px; border-radius: 10px; }
    .row .title { font-size: 16px; }
    .row .subtitle { font-size: 13px; }
    .mini-player {
      left: 0;
      right: 0;
      bottom: 0;
      transform: none;
      width: 100%;
      max-width: none;
      border-radius: 0;
      border-left: none;
      border-right: none;
      border-bottom: none;
      padding: 14px 32px;
      gap: 18px;
    }
    .mini-player .thumb { width: 44px; height: 44px; border-radius: 8px; }
    .mini-player .title { font-size: 15px; }
    .mini-player .info { max-width: 420px; flex: 0 1 auto; }
  }
</style>
</head>
<body>

<div class="app-shell">

  <!-- ============ SIDEBAR (desktop) ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title">Clip Playlist</div>
    <button class="sidebar-nav-item" id="sidebarLibraryBtn" type="button">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="14" height="12" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
      <span>Library</span>
    </button>
    <button class="sidebar-nav-item" id="sidebarNowPlayingBtn" type="button">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12v0M8 8v8M12 5v14M16 8v8M20 12v0"/></svg>
      <span>Now Playing</span>
    </button>
    <div class="sidebar-section-label">Playlists</div>
    <div class="sidebar-playlist-list" id="sidebarPlaylistList"></div>
    <button class="list-add-btn" id="sidebarNewPlaylistBtn" type="button">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>New Playlist</span>
    </button>
  </aside>

  <div class="app">

    <!-- ============ PLAYLISTS SCREEN ============ -->
    <section class="screen active" id="screen-playlists">
      <div class="nav-header">
        <button class="title-switcher" id="playlistTitleBtn" type="button">
          <h1 id="playlistTitle">Playlists</h1>
          <svg class="chev-down" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button class="nav-action" id="addClipBtn" title="Add clip">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>

      <div class="list-meta" id="countLabel"></div>
      <div class="list" id="queueList"></div>
    </section>

    <!-- ============ NOW PLAYING SCREEN ============ -->
    <section class="screen" id="screen-nowplaying">
      <div class="nav-header">
        <h1>Now Playing</h1>
      </div>

      <div class="np-art"><div id="player"></div></div>

      <div class="np-meta">
        <div class="np-title" id="nowLabel">&mdash;</div>
        <div class="np-artist" id="nowArtistLabel">&nbsp;</div>
      </div>

      <div class="np-progress-track" id="clipProgress">
        <div class="np-progress-fill" id="clipProgressFill"></div>
      </div>
      <div class="np-time-row">
        <span id="elapsedLabel">0:00</span>
        <span id="durationLabel">0:00</span>
      </div>

      <div class="np-transport">
        <button id="prevBtn" title="Previous clip">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M11 6L4 12l7 6V6zM20 6l-7 6 7 6V6z"/></svg>
        </button>
        <button id="playBtn" title="Play/Pause">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="nextBtn" title="Next clip">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M13 6l7 6-7 6V6zM4 6l7 6-7 6V6z"/></svg>
        </button>
      </div>

      <div class="np-toggles">
        <button id="autoBtn" class="pill-toggle on">Auto-advance</button>
        <button id="loopBtn" class="pill-toggle">Loop clip</button>
      </div>

      <div class="np-status" id="statusLabel">loading…</div>
    </section>

  </div>

</div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const SUPABASE_URL = "https://ebzwftobzslvgwxwztqg.supabase.co";
  const SUPABASE_KEY = "sb_publishable_VQfWQsKmOWRYr4vGw6UTwQ_T9ezfT3b";
  const LS_KEY = "clipPlaylist:lastPlaylistId";

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  let playlists = [];         // { id, name, created_at }
  let currentPlaylistId = null;
  let clips = [];              // { id, name, artist, videoId, start, end, position }
  let currentId = null;        // id of the clip currently loaded in the player
  let libraryCache = [];
  let player = null;
  let apiReady = false;
  let dataReady = false;
  let autoAdvance = true;
  let loopClip = false;
  let pollTimer = null;
  let dragSourceIndex = null;
  let activeTab = "playlists";

  // ---------- helpers ----------

  function fmt(s) {
    s = Math.max(0, Math.floor(s));
    const m = Math.floor(s / 60);
    const sec = String(s % 60).padStart(2, "0");
    return m + ":" + sec;
  }

  function escapeHtml(str) {
    return String(str ?? "").replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[ch]));
  }

  function thumbUrl(videoId) {
    return "https://i.ytimg.com/vi/" + encodeURIComponent(videoId) + "/default.jpg";
  }

  function parseTimeToSeconds(input) {
    input = String(input ?? "").trim();
    if (!input) return NaN;
    if (input.includes(":")) {
      const parts = input.split(":").map((p) => p.trim());
      if (parts.some((p) => p === "" || isNaN(Number(p)))) return NaN;
      let seconds = 0;
      for (const p of parts) seconds = seconds * 60 + Number(p);
      return seconds;
    }
    const n = Number(input);
    return isNaN(n) ? NaN : n;
  }

  function extractVideoId(raw) {
    const input = String(raw ?? "").trim();
    try {
      const u = new URL(input);
      const host = u.hostname.replace(/^www\./, "");
      if (host === "youtu.be") {
        return u.pathname.slice(1).split("/")[0] || null;
      }
      if (host === "youtube.com" || host === "m.youtube.com" || host === "music.youtube.com") {
        if (u.pathname === "/watch") return u.searchParams.get("v");
        let m = u.pathname.match(/\/shorts\/([^/?]+)/);
        if (m) return m[1];
        m = u.pathname.match(/\/embed\/([^/?]+)/);
        if (m) return m[1];
        m = u.pathname.match(/\/live\/([^/?]+)/);
        if (m) return m[1];
      }
    } catch (e) {
      // not a parseable URL — allow a bare video id
      if (/^[a-zA-Z0-9_-]{10,12}$/.test(input)) return input;
    }
    return null;
  }

  function splitTitle(title) {
    const dashPattern = /\s+[-–—]\s+/;
    const m = title.match(dashPattern);
    if (m) {
      const idx = title.search(dashPattern);
      const artist = title.slice(0, idx).trim();
      const name = title.slice(idx + m[0].length).trim();
      if (artist && name) return { name, artist };
    }
    return { name: title.trim(), artist: "" };
  }

  async function fetchOEmbedTitle(videoId) {
    const watchUrl = "https://www.youtube.com/watch?v=" + encodeURIComponent(videoId);
    const res = await fetch("https://www.youtube.com/oembed?url=" + encodeURIComponent(watchUrl) + "&format=json");
    if (!res.ok) throw new Error("oEmbed lookup failed (" + res.status + ")");
    const data = await res.json();
    return data.title || "";
  }

  function rowToClip(row) {
    return {
      id: row.id,
      name: row.name,
      artist: row.artist || "",
      videoId: row.video_id,
      start: Number(row.start_seconds),
      end: Number(row.end_seconds),
      position: row.position
    };
  }

  function getCurrentIndex() {
    return clips.findIndex((c) => c.id === currentId);
  }

  // ---------- generic sheet helpers ----------

  function openSheet(sheetEl, backdropEl) {
    backdropEl.classList.add("open");
    requestAnimationFrame(() => sheetEl.classList.add("open"));
  }

  function closeSheet(sheetEl, backdropEl) {
    sheetEl.classList.remove("open");
    backdropEl.classList.remove("open");
  }

  function wireSheetDismiss(sheetEl, backdropEl, onClose) {
    backdropEl.addEventListener("click", () => { closeSheet(sheetEl, backdropEl); if (onClose) onClose(); });
  }

  // ---------- tabs / nav ----------

  function syncNavActiveStates() {
    const libraryOpen = document.getElementById("librarySheet").classList.contains("open");
    document.getElementById("tabPlaylists").classList.toggle("active", !libraryOpen && activeTab === "playlists");
    document.getElementById("tabNowPlaying").classList.toggle("active", !libraryOpen && activeTab === "nowplaying");
    document.getElementById("tabLibrary").classList.toggle("active", libraryOpen);
    document.getElementById("sidebarNowPlayingBtn").classList.toggle("active", !libraryOpen && activeTab === "nowplaying");
    document.getElementById("sidebarLibraryBtn").classList.toggle("active", libraryOpen);
  }

  function switchTab(tab) {
    activeTab = tab;
    document.getElementById("screen-playlists").classList.toggle("active", tab === "playlists");
    document.getElementById("screen-nowplaying").classList.toggle("active", tab === "nowplaying");
    syncNavActiveStates();
    updateMiniPlayerVisibility();
  }

  document.getElementById("tabPlaylists").addEventListener("click", () => switchTab("playlists"));
  document.getElementById("tabNowPlaying").addEventListener("click", () => switchTab("nowplaying"));
  document.getElementById("tabLibrary").addEventListener("click", openLibrarySheet);
  document.getElementById("sidebarNowPlayingBtn").addEventListener("click", () => switchTab("nowplaying"));
  document.getElementById("sidebarLibraryBtn").addEventListener("click", openLibrarySheet);

  // ---------- playlists ----------

  async function loadPlaylists() {
    const { data, error } = await supabase.from("playlists").select("*").order("created_at", { ascending: true });
    if (error) throw error;
    playlists = data || [];
  }

  function buildPlaylistRow(p, onSelect) {
    const row = document.createElement("div");
    row.className = "playlist-row" + (p.id === currentPlaylistId ? " active" : "");

    const nameSpan = document.createElement("span");
    nameSpan.className = "playlist-name";
    nameSpan.textContent = p.name;
    row.appendChild(nameSpan);

    if (p.id === currentPlaylistId) {
      const check = document.createElement("span");
      check.className = "row-check";
      check.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
      row.appendChild(check);
    }

    const moreBtn = document.createElement("button");
    moreBtn.type = "button";
    moreBtn.className = "row-more-btn";
    moreBtn.title = "More";
    moreBtn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>';
    moreBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      openPlaylistActions(p, nameSpan);
    });
    row.appendChild(moreBtn);

    row.addEventListener("click", () => {
      if (onSelect) onSelect(p);
      else switchPlaylist(p.id);
    });

    return row;
  }

  function renderSidebarPlaylists() {
    const list = document.getElementById("sidebarPlaylistList");
    list.innerHTML = "";
    if (playlists.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.style.padding = "12px 10px";
      empty.style.textAlign = "left";
      empty.textContent = "No playlists yet";
      list.appendChild(empty);
      return;
    }
    playlists.forEach((p) => list.appendChild(buildPlaylistRow(p)));
  }

  function renderPlaylistPickerList() {
    const list = document.getElementById("playlistPickerList");
    list.innerHTML = "";
    if (playlists.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No playlists yet";
      list.appendChild(empty);
      return;
    }
    playlists.forEach((p) => {
      list.appendChild(
        buildPlaylistRow(p, (picked) => {
          switchPlaylist(picked.id);
          closeSheet(document.getElementById("playlistPickerSheet"), document.getElementById("playlistPickerBackdrop"));
        })
      );
    });
  }

  function updatePlaylistTitleLabel() {
    const titleEl = document.getElementById("playlistTitle");
    const current = playlists.find((p) => p.id === currentPlaylistId);
    titleEl.textContent = current ? current.name : "Playlists";
  }

  function refreshPlaylistUI() {
    renderSidebarPlaylists();
    renderPlaylistPickerList();
    updatePlaylistTitleLabel();
  }

  function openPlaylistPicker() {
    renderPlaylistPickerList();
    openSheet(document.getElementById("playlistPickerSheet"), document.getElementById("playlistPickerBackdrop"));
  }
  document.getElementById("playlistTitleBtn").addEventListener("click", openPlaylistPicker);
  document.getElementById("playlistPickerCloseBtn").addEventListener("click", () =>
    closeSheet(document.getElementById("playlistPickerSheet"), document.getElementById("playlistPickerBackdrop"))
  );
  wireSheetDismiss(document.getElementById("playlistPickerSheet"), document.getElementById("playlistPickerBackdrop"));
  document.getElementById("pickerNewPlaylistBtn").addEventListener("click", () => {
    closeSheet(document.getElementById("playlistPickerSheet"), document.getElementById("playlistPickerBackdrop"));
    openNewPlaylistSheet();
  });
  document.getElementById("sidebarNewPlaylistBtn").addEventListener("click", openNewPlaylistSheet);

  // ---------- playlist actions (rename / delete) ----------

  function openPlaylistActions(playlist, nameSpanEl) {
    document.getElementById("actionSheetTitle").textContent = playlist.name;
    const list = document.getElementById("actionList");
    list.innerHTML = "";

    const renameBtn = document.createElement("button");
    renameBtn.className = "action-btn";
    renameBtn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> Rename';
    renameBtn.addEventListener("click", () => {
      closeSheet(document.getElementById("actionSheet"), document.getElementById("actionBackdrop"));
      startPlaylistRename(nameSpanEl, playlist);
    });

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "action-btn danger";
    deleteBtn.disabled = playlists.length <= 1;
    deleteBtn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0-1 14a1 1 0 01-1 1H7a1 1 0 01-1-1L5 6"/></svg> Delete Playlist';
    deleteBtn.addEventListener("click", () => {
      closeSheet(document.getElementById("actionSheet"), document.getElementById("actionBackdrop"));
      deletePlaylist(playlist);
    });

    list.appendChild(renameBtn);
    list.appendChild(deleteBtn);
    openSheet(document.getElementById("actionSheet"), document.getElementById("actionBackdrop"));
  }
  document.getElementById("actionCancelBtn").addEventListener("click", () =>
    closeSheet(document.getElementById("actionSheet"), document.getElementById("actionBackdrop"))
  );
  wireSheetDismiss(document.getElementById("actionSheet"), document.getElementById("actionBackdrop"));

  function startPlaylistRename(spanEl, playlist) {
    if (spanEl.querySelector("input")) return;
    const original = playlist.name;
    const input = document.createElement("input");
    input.type = "text";
    input.className = "inline-rename-input";
    input.value = original;
    spanEl.textContent = "";
    spanEl.appendChild(input);
    input.focus();
    input.select();

    let settled = false;

    const trySave = async () => {
      const val = input.value.trim();
      if (!val) {
        input.classList.add("invalid");
        return false;
      }
      settled = true;
      if (val !== original) {
        const { error } = await supabase.from("playlists").update({ name: val }).eq("id", playlist.id);
        if (error) {
          window.alert("Failed to rename playlist: " + error.message);
        } else {
          playlist.name = val;
        }
      }
      refreshPlaylistUI();
      return true;
    };

    input.addEventListener("input", () => input.classList.remove("invalid"));
    input.addEventListener("click", (e) => e.stopPropagation());
    input.addEventListener("keydown", async (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        await trySave();
      } else if (e.key === "Escape") {
        e.preventDefault();
        settled = true;
        refreshPlaylistUI();
      }
    });
    input.addEventListener("blur", async () => {
      if (settled) return;
      const ok = await trySave();
      if (!ok) { settled = true; refreshPlaylistUI(); }
    });
  }

  async function getClipCountForPlaylist(id) {
    const { count, error } = await supabase
      .from("clips")
      .select("id", { count: "exact", head: true })
      .eq("playlist_id", id);
    if (error) {
      console.error("Failed to count clips", error);
      return null;
    }
    return count || 0;
  }

  async function deletePlaylist(playlist) {
    if (playlists.length <= 1) {
      window.alert("You need at least one playlist — create another before deleting this one.");
      return;
    }

    const count = await getClipCountForPlaylist(playlist.id);
    const countText = count === null ? "its clips" : count + (count === 1 ? " clip" : " clips");
    const ok = window.confirm('Delete "' + playlist.name + '"? This removes all ' + countText + " in it.");
    if (!ok) return;

    const { error } = await supabase.from("playlists").delete().eq("id", playlist.id);
    if (error) {
      window.alert("Failed to delete playlist: " + error.message);
      return;
    }

    playlists = playlists.filter((p) => p.id !== playlist.id);

    if (playlist.id === currentPlaylistId) {
      await switchPlaylist(playlists[0].id);
    } else {
      refreshPlaylistUI();
    }
  }

  async function loadClipsForCurrentPlaylist() {
    if (!currentPlaylistId) { clips = []; return; }
    const { data, error } = await supabase
      .from("clips")
      .select("*")
      .eq("playlist_id", currentPlaylistId)
      .order("position", { ascending: true });
    if (error) {
      console.error("Failed to load clips", error);
      clips = [];
      document.getElementById("statusLabel").textContent = "failed to load clips: " + error.message;
      return;
    }
    clips = (data || []).map(rowToClip);
  }

  async function switchPlaylist(playlistId) {
    if (!playlistId || playlistId === currentPlaylistId) return;
    currentPlaylistId = playlistId;
    localStorage.setItem(LS_KEY, playlistId);
    currentId = null;
    document.getElementById("statusLabel").textContent = "loading clips…";

    await loadClipsForCurrentPlaylist();
    if (clips.length > 0) currentId = clips[0].id;

    if (player) {
      if (clips.length > 0) {
        const c = clips[0];
        player.loadVideoById({ videoId: c.videoId, startSeconds: c.start });
        player.pauseVideo();
        document.getElementById("statusLabel").textContent = "ready — press play";
      } else {
        stopAndClearPlayer();
      }
    } else {
      maybeInitPlayer();
      if (clips.length === 0) document.getElementById("statusLabel").textContent = "queue is empty — add a clip below";
    }

    refreshPlaylistUI();
    switchTab("playlists");
    renderQueue();
    updateMiniPlayer();
  }

  // ---------- new playlist sheet ----------

  function openNewPlaylistSheet() {
    document.getElementById("newPlaylistInput").value = "";
    openSheet(document.getElementById("newPlaylistSheet"), document.getElementById("newPlaylistBackdrop"));
    setTimeout(() => document.getElementById("newPlaylistInput").focus(), 260);
  }
  function closeNewPlaylistSheet() {
    closeSheet(document.getElementById("newPlaylistSheet"), document.getElementById("newPlaylistBackdrop"));
  }
  document.getElementById("newPlaylistCancelBtn").addEventListener("click", closeNewPlaylistSheet);
  wireSheetDismiss(document.getElementById("newPlaylistSheet"), document.getElementById("newPlaylistBackdrop"));

  document.getElementById("newPlaylistForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("newPlaylistInput");
    const name = input.value.trim();
    if (!name) return;
    const submitBtn = e.target.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    const { data, error } = await supabase.from("playlists").insert({ name }).select().single();
    submitBtn.disabled = false;
    if (error) {
      window.alert("Failed to create playlist: " + error.message);
      return;
    }
    playlists.push(data);
    closeNewPlaylistSheet();
    await switchPlaylist(data.id);
  });

  // ---------- rendering: queue ----------

  function renderQueue() {
    const q = document.getElementById("queueList");
    q.innerHTML = "";
    document.getElementById("countLabel").textContent = clips.length
      ? clips.length + (clips.length === 1 ? " clip" : " clips")
      : "";

    if (clips.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = playlists.length === 0 ? "Create a playlist to get started" : "No clips yet — tap + to add one";
      q.appendChild(empty);
      return;
    }

    clips.forEach((c, i) => {
      const row = document.createElement("div");
      row.className = "row" + (c.id === currentId ? " active" : "");
      row.dataset.id = c.id;

      const displayName = c.artist ? c.artist + " — " + c.name : c.name;

      row.innerHTML =
        '<span class="grip" title="Drag to reorder">' +
          '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="9" cy="5" r="1.5"/><circle cx="15" cy="5" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="15" cy="19" r="1.5"/></svg>' +
        "</span>" +
        '<img class="thumb" src="' + thumbUrl(c.videoId) + '" alt="" loading="lazy">' +
        '<div class="info">' +
          '<div class="title">' + escapeHtml(displayName) + "</div>" +
          '<div class="subtitle">' +
            '<span class="time-edit" data-field="start">' + fmt(c.start) + "</span>" +
            " – " +
            '<span class="time-edit" data-field="end">' + fmt(c.end) + "</span>" +
          "</div>" +
        "</div>" +
        '<button class="trailing-btn" title="More">' +
          '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>' +
        "</button>";

      // click row -> load clip
      row.addEventListener("click", () => loadClip(i, true));

      // inline start/end editing
      row.querySelectorAll(".time-edit").forEach((span) => {
        span.addEventListener("click", (e) => {
          e.stopPropagation();
          startTimeEdit(span, c);
        });
      });

      // row actions sheet
      row.querySelector(".trailing-btn").addEventListener("click", (e) => {
        e.stopPropagation();
        openRowActions(c, i);
      });

      // drag and drop (initiated from handle, dropped on row)
      const handle = row.querySelector(".grip");
      handle.draggable = true;
      handle.addEventListener("dragstart", (e) => {
        e.stopPropagation();
        dragSourceIndex = i;
        e.dataTransfer.effectAllowed = "move";
        try { e.dataTransfer.setData("text/plain", String(c.id)); } catch (err) {}
        row.classList.add("dragging");
      });
      handle.addEventListener("dragend", (e) => {
        e.stopPropagation();
        row.classList.remove("dragging");
        dragSourceIndex = null;
      });
      row.addEventListener("dragover", (e) => {
        if (dragSourceIndex === null) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        row.classList.add("drag-over");
      });
      row.addEventListener("dragleave", () => row.classList.remove("drag-over"));
      row.addEventListener("drop", (e) => {
        e.preventDefault();
        row.classList.remove("drag-over");
        if (dragSourceIndex === null || dragSourceIndex === i) return;
        reorderByIndex(dragSourceIndex, i);
        dragSourceIndex = null;
      });

      q.appendChild(row);
    });
  }

  function openRowActions(clip, idx) {
    document.getElementById("actionSheetTitle").textContent = clip.name;
    const list = document.getElementById("actionList");
    list.innerHTML = "";

    const upBtn = document.createElement("button");
    upBtn.className = "action-btn";
    upBtn.disabled = idx === 0;
    upBtn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg> Move Up';
    upBtn.addEventListener("click", () => {
      moveClip(idx, -1);
      closeSheet(document.getElementById("actionSheet"), document.getElementById("actionBackdrop"));
    });

    const downBtn = document.createElement("button");
    downBtn.className = "action-btn";
    downBtn.disabled = idx === clips.length - 1;
    downBtn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg> Move Down';
    downBtn.addEventListener("click", () => {
      moveClip(idx, 1);
      closeSheet(document.getElementById("actionSheet"), document.getElementById("actionBackdrop"));
    });

    const delBtn = document.createElement("button");
    delBtn.className = "action-btn danger";
    delBtn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0-1 14a1 1 0 01-1 1H7a1 1 0 01-1-1L5 6"/></svg> Delete Clip';
    delBtn.addEventListener("click", () => {
      closeSheet(document.getElementById("actionSheet"), document.getElementById("actionBackdrop"));
      deleteClip(clip.id);
    });

    list.appendChild(upBtn);
    list.appendChild(downBtn);
    list.appendChild(delBtn);
    openSheet(document.getElementById("actionSheet"), document.getElementById("actionBackdrop"));
  }

  function reorderByIndex(fromIdx, toIdx) {
    const [item] = clips.splice(fromIdx, 1);
    clips.splice(toIdx, 0, item);
    renderQueue();
    persistOrder();
  }

  function moveClip(idx, dir) {
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= clips.length) return;
    const [item] = clips.splice(idx, 1);
    clips.splice(newIdx, 0, item);
    renderQueue();
    persistOrder();
  }

  async function persistOrder() {
    clips.forEach((c, i) => { c.position = i; });
    try {
      await Promise.all(
        clips.map((c) => supabase.from("clips").update({ position: c.position }).eq("id", c.id))
      );
    } catch (err) {
      console.error("Failed to persist clip order", err);
    }
  }

  function startTimeEdit(span, clip) {
    if (span.querySelector("input")) return; // already editing
    const field = span.dataset.field; // "start" | "end"
    const original = fmt(clip[field]);
    const input = document.createElement("input");
    input.type = "text";
    input.className = "time-input";
    input.value = original;
    span.textContent = "";
    span.appendChild(input);
    input.focus();
    input.select();

    let settled = false;

    const trySave = async () => {
      const val = parseTimeToSeconds(input.value);
      const other = field === "start" ? clip.end : clip.start;
      const validNumber = !isNaN(val) && val >= 0;
      const validOrder = field === "start" ? val < other : val > other;
      if (!validNumber || !validOrder) {
        input.classList.add("invalid");
        return false;
      }
      const prev = clip[field];
      clip[field] = val;
      const dbField = field === "start" ? "start_seconds" : "end_seconds";
      const { error } = await supabase.from("clips").update({ [dbField]: val }).eq("id", clip.id);
      if (error) {
        console.error("Failed to save time edit", error);
        clip[field] = prev;
      }
      settled = true;
      renderQueue();
      return true;
    };

    input.addEventListener("input", () => input.classList.remove("invalid"));
    input.addEventListener("click", (e) => e.stopPropagation());
    input.addEventListener("keydown", async (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        await trySave();
      } else if (e.key === "Escape") {
        e.preventDefault();
        settled = true;
        renderQueue();
      }
    });
    input.addEventListener("blur", async () => {
      if (settled) return;
      const ok = await trySave();
      if (!ok) { settled = true; renderQueue(); } // silently revert if left invalid
    });
  }

  async function deleteClip(id) {
    const idx = clips.findIndex((c) => c.id === id);
    if (idx === -1) return;
    const clip = clips[idx];
    const ok = window.confirm('Delete "' + clip.name + '" from the queue?');
    if (!ok) return;

    const { error } = await supabase.from("clips").delete().eq("id", id);
    if (error) {
      window.alert("Failed to delete: " + error.message);
      return;
    }

    clips.splice(idx, 1);
    await persistOrder();

    if (clips.length === 0) {
      currentId = null;
      stopAndClearPlayer();
    } else if (id === currentId) {
      const newIdx = Math.min(idx, clips.length - 1);
      loadClip(newIdx, false);
    }
    renderQueue();
    updateMiniPlayer();
  }

  function stopAndClearPlayer() {
    if (player && player.stopVideo) player.stopVideo();
    document.getElementById("statusLabel").textContent = "queue is empty — add a clip below";
    document.getElementById("nowLabel").textContent = "—";
    document.getElementById("nowArtistLabel").textContent = " ";
    document.getElementById("elapsedLabel").textContent = "0:00";
    document.getElementById("durationLabel").textContent = "0:00";
    document.getElementById("clipProgressFill").style.width = "0%";
    updateMiniPlayer();
  }

  // ---------- clip library (sheet) ----------

  document.getElementById("librarySearch").addEventListener("input", (e) => renderLibraryList(e.target.value));

  async function openLibrarySheet() {
    if (!currentPlaylistId) {
      window.alert("Create a playlist first.");
      return;
    }
    const listEl = document.getElementById("libraryList");
    document.getElementById("librarySearch").value = "";
    listEl.innerHTML = '<div class="empty-state">Loading…</div>';
    openSheet(document.getElementById("librarySheet"), document.getElementById("libraryBackdrop"));
    syncNavActiveStates();
    try {
      const { data, error } = await supabase
        .from("clip_library")
        .select("*")
        .order("last_used_at", { ascending: false });
      if (error) throw error;
      libraryCache = data || [];
    } catch (err) {
      listEl.innerHTML = '<div class="empty-state">Failed to load library: ' + escapeHtml(err.message) + "</div>";
      return;
    }
    renderLibraryList("");
  }

  function closeLibrarySheet() {
    closeSheet(document.getElementById("librarySheet"), document.getElementById("libraryBackdrop"));
    syncNavActiveStates();
  }
  document.getElementById("libraryCloseBtn").addEventListener("click", closeLibrarySheet);
  wireSheetDismiss(document.getElementById("librarySheet"), document.getElementById("libraryBackdrop"), closeLibrarySheet);

  function renderLibraryList(filterText) {
    const listEl = document.getElementById("libraryList");
    const q = filterText.trim().toLowerCase();
    const items = q
      ? libraryCache.filter((it) =>
          (it.name || "").toLowerCase().includes(q) || (it.artist || "").toLowerCase().includes(q)
        )
      : libraryCache;

    listEl.innerHTML = "";
    if (items.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = libraryCache.length ? "No matches" : "Library is empty — add a clip to populate it";
      listEl.appendChild(empty);
      return;
    }

    items.forEach((entry) => {
      const row = document.createElement("div");
      row.className = "row";
      const displayName = entry.artist ? entry.artist + " — " + entry.name : entry.name;
      row.innerHTML =
        '<img class="thumb" src="' + thumbUrl(entry.video_id) + '" alt="" loading="lazy">' +
        '<div class="info">' +
          '<div class="title">' + escapeHtml(displayName) + "</div>" +
          '<div class="subtitle">' + fmt(entry.start_seconds) + " – " + fmt(entry.end_seconds) + "</div>" +
        "</div>" +
        '<span class="add-check"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>';
      row.addEventListener("click", () => addFromLibrary(entry, row));
      listEl.appendChild(row);
    });
  }

  async function addFromLibrary(entry, rowEl) {
    if (!currentPlaylistId) return;
    const nextPosition = clips.length ? Math.max(...clips.map((c) => c.position)) + 1 : 0;

    const { data, error } = await supabase
      .from("clips")
      .insert({
        playlist_id: currentPlaylistId,
        position: nextPosition,
        name: entry.name,
        artist: entry.artist,
        video_id: entry.video_id,
        start_seconds: entry.start_seconds,
        end_seconds: entry.end_seconds
      })
      .select()
      .single();

    if (error) {
      window.alert("Failed to add clip: " + error.message);
      return;
    }

    clips.push(rowToClip(data));
    if (!currentId) currentId = data.id;
    renderQueue();
    maybeInitPlayer();
    updateMiniPlayer();

    if (rowEl) {
      rowEl.classList.add("added");
      setTimeout(() => rowEl.classList.remove("added"), 1200);
    }

    const now = new Date().toISOString();
    entry.last_used_at = now;
    const { error: bumpError } = await supabase.from("clip_library").update({ last_used_at: now }).eq("id", entry.id);
    if (bumpError) console.error("Failed to bump last_used_at", bumpError);
  }

  // ---------- add clip sheet ----------

  document.getElementById("addClipBtn").addEventListener("click", () => {
    document.getElementById("addStatus").className = "status-line";
    document.getElementById("addStatus").textContent = "";
    document.getElementById("urlInput").value = "";
    document.getElementById("startInput").value = "";
    document.getElementById("endInput").value = "";
    openSheet(document.getElementById("addClipSheet"), document.getElementById("addClipBackdrop"));
    setTimeout(() => document.getElementById("urlInput").focus(), 260);
  });
  function closeAddClipSheet() {
    closeSheet(document.getElementById("addClipSheet"), document.getElementById("addClipBackdrop"));
  }
  document.getElementById("addClipCancelBtn").addEventListener("click", closeAddClipSheet);
  wireSheetDismiss(document.getElementById("addClipSheet"), document.getElementById("addClipBackdrop"));

  document.getElementById("addClipForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const statusEl = document.getElementById("addStatus");
    const addBtn = document.getElementById("addBtn");
    const urlInput = document.getElementById("urlInput");
    const startInput = document.getElementById("startInput");
    const endInput = document.getElementById("endInput");

    statusEl.className = "status-line";
    statusEl.textContent = "";

    if (!currentPlaylistId) {
      statusEl.className = "status-line error";
      statusEl.textContent = "create a playlist first";
      return;
    }

    const videoId = extractVideoId(urlInput.value);
    if (!videoId) {
      statusEl.className = "status-line error";
      statusEl.textContent = "couldn't find a video id in that link";
      return;
    }
    const start = parseTimeToSeconds(startInput.value);
    const end = parseTimeToSeconds(endInput.value);
    if (isNaN(start) || isNaN(end)) {
      statusEl.className = "status-line error";
      statusEl.textContent = "start/end must be seconds or m:ss";
      return;
    }
    if (!(start < end)) {
      statusEl.className = "status-line error";
      statusEl.textContent = "start must be before end";
      return;
    }

    addBtn.disabled = true;
    statusEl.className = "status-line";
    statusEl.textContent = "fetching title…";

    let name = "Clip " + videoId;
    let artist = "";
    try {
      const title = await fetchOEmbedTitle(videoId);
      if (title) {
        const split = splitTitle(title);
        name = split.name;
        artist = split.artist;
      }
    } catch (err) {
      console.warn("oEmbed lookup failed, using fallback title", err);
    }

    const nowIso = new Date().toISOString();
    const { error: libError } = await supabase.from("clip_library").upsert(
      {
        video_id: videoId,
        start_seconds: start,
        end_seconds: end,
        name,
        artist: artist || null,
        last_used_at: nowIso
      },
      { onConflict: "video_id,start_seconds,end_seconds" }
    );
    if (libError) console.error("Failed to upsert clip_library", libError);

    const nextPosition = clips.length
      ? Math.max(...clips.map((c) => c.position)) + 1
      : 0;

    const { data, error } = await supabase
      .from("clips")
      .insert({
        playlist_id: currentPlaylistId,
        position: nextPosition,
        name,
        artist: artist || null,
        video_id: videoId,
        start_seconds: start,
        end_seconds: end
      })
      .select()
      .single();

    addBtn.disabled = false;

    if (error) {
      statusEl.className = "status-line error";
      statusEl.textContent = "failed to add: " + error.message;
      return;
    }

    clips.push(rowToClip(data));
    if (!currentId) currentId = data.id;
    statusEl.className = "status-line ok";
    statusEl.textContent = "added “" + name + "”";
    renderQueue();
    maybeInitPlayer();
    updateMiniPlayer();
    setTimeout(closeAddClipSheet, 500);
  });

  // ---------- player ----------

  function loadClip(i, autoplay) {
    if (clips.length === 0) return;
    if (i < 0) i = clips.length - 1;
    if (i >= clips.length) {
      if (autoAdvance) { i = 0; autoplay = false; }
      else return;
    }
    const c = clips[i];
    currentId = c.id;
    renderQueue();
    updateMiniPlayer();
    if (player && player.loadVideoById) {
      player.loadVideoById({ videoId: c.videoId, startSeconds: c.start });
      if (!autoplay) player.pauseVideo();
    }
  }

  function maybeInitPlayer() {
    if (!apiReady || !dataReady || player || clips.length === 0) return;
    let idx = getCurrentIndex();
    if (idx === -1) { idx = 0; currentId = clips[0].id; }
    const c = clips[idx];
    player = new YT.Player("player", {
      videoId: c.videoId,
      playerVars: { start: Math.floor(c.start), rel: 0, modestbranding: 1 },
      events: {
        onReady: () => {
          document.getElementById("statusLabel").textContent = "ready — press play";
          startPolling();
          updateMiniPlayer();
        },
        onStateChange: onStateChange
      }
    });
  }

  window.onYouTubeIframeAPIReady = function () {
    apiReady = true;
    maybeInitPlayer();
  };

  function setPlayIcon(playing) {
    const bigIcon = document.getElementById("playIcon");
    const miniIcon = document.getElementById("miniPlayIcon");
    const path = playing
      ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
    bigIcon.innerHTML = path;
    miniIcon.innerHTML = path;
  }

  function onStateChange(e) {
    if (e.data === YT.PlayerState.PLAYING) setPlayIcon(true);
    if (e.data === YT.PlayerState.PAUSED) setPlayIcon(false);
  }

  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(() => {
      if (!player || !player.getCurrentTime) return;
      const idx = getCurrentIndex();
      if (idx === -1) return;
      const c = clips[idx];
      const t = player.getCurrentTime();
      const dur = c.end - c.start;
      const elapsed = Math.max(0, t - c.start);
      const pct = dur > 0 ? Math.min(100, (elapsed / dur) * 100) : 0;
      document.getElementById("clipProgressFill").style.width = pct + "%";
      document.getElementById("miniProgressFill").style.width = pct + "%";
      document.getElementById("elapsedLabel").textContent = fmt(elapsed);
      document.getElementById("durationLabel").textContent = fmt(dur);

      if (t >= c.end) {
        if (loopClip) {
          player.seekTo(c.start, true);
        } else if (autoAdvance) {
          loadClip(idx + 1, true);
        } else {
          player.pauseVideo();
        }
      }
    }, 250);
  }

  function togglePlayPause() {
    if (!player || !player.getPlayerState) return;
    const state = player.getPlayerState();
    if (state === YT.PlayerState.PLAYING) player.pauseVideo();
    else player.playVideo();
  }

  document.getElementById("playBtn").addEventListener("click", togglePlayPause);
  document.getElementById("miniPlayBtn").addEventListener("click", (e) => { e.stopPropagation(); togglePlayPause(); });
  document.getElementById("nextBtn").addEventListener("click", () => loadClip(getCurrentIndex() + 1, true));
  document.getElementById("prevBtn").addEventListener("click", () => loadClip(getCurrentIndex() - 1, true));
  document.getElementById("miniNextBtn").addEventListener("click", (e) => { e.stopPropagation(); loadClip(getCurrentIndex() + 1, true); });
  document.getElementById("autoBtn").addEventListener("click", (e) => {
    autoAdvance = !autoAdvance;
    e.currentTarget.classList.toggle("on", autoAdvance);
  });
  document.getElementById("loopBtn").addEventListener("click", (e) => {
    loopClip = !loopClip;
    e.currentTarget.classList.toggle("on", loopClip);
  });
  document.getElementById("clipProgress").addEventListener("click", (e) => {
    if (!player || !player.seekTo) return;
    const idx = getCurrentIndex();
    if (idx === -1) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    const c = clips[idx];
    const target = c.start + pct * (c.end - c.start);
    player.seekTo(target, true);
  });

  document.getElementById("miniPlayer").addEventListener("click", () => switchTab("nowplaying"));

  // ---------- mini player sync ----------

  function updateMiniPlayer() {
    const mini = document.getElementById("miniPlayer");
    const idx = getCurrentIndex();
    if (idx === -1) {
      mini.hidden = true;
      return;
    }
    const c = clips[idx];
    document.getElementById("miniThumb").src = thumbUrl(c.videoId);
    document.getElementById("miniTitle").textContent = c.artist ? c.artist + " — " + c.name : c.name;
    document.getElementById("nowLabel").textContent = c.name;
    document.getElementById("nowArtistLabel").textContent = c.artist || " ";
    mini.hidden = false;
    updateMiniPlayerVisibility();
  }

  function updateMiniPlayerVisibility() {
    const mini = document.getElementById("miniPlayer");
    if (getCurrentIndex() === -1) { mini.hidden = true; return; }
    mini.hidden = activeTab === "nowplaying";
  }

  // ---------- init ----------

  async function init() {
    document.getElementById("statusLabel").textContent = "loading…";
    try {
      await loadPlaylists();
    } catch (err) {
      console.error("Failed to load playlists", err);
      document.getElementById("statusLabel").textContent = "failed to load playlists: " + err.message;
      dataReady = true;
      refreshPlaylistUI();
      renderQueue();
      return;
    }

    if (playlists.length === 0) {
      dataReady = true;
      refreshPlaylistUI();
      renderQueue();
      document.getElementById("statusLabel").textContent = "no playlists yet — create one above";
      return;
    }

    const saved = localStorage.getItem(LS_KEY);
    currentPlaylistId = playlists.some((p) => p.id === saved) ? saved : playlists[0].id;
    localStorage.setItem(LS_KEY, currentPlaylistId);
    refreshPlaylistUI();

    await loadClipsForCurrentPlaylist();
    if (clips.length > 0) currentId = clips[0].id;
    dataReady = true;
    renderQueue();
    maybeInitPlayer();
    updateMiniPlayer();
    document.getElementById("statusLabel").textContent = clips.length
      ? "ready — press play"
      : "queue is empty — add a clip below";
  }

  init();

  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);
</script>

</body>
